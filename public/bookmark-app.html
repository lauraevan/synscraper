<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Synscraper Mini</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#060606;--panel:#0b0b0b;--panel2:#101010;--line:rgba(255,255,255,.085);--line2:rgba(255,255,255,.14);--soft:rgba(255,255,255,.055);--muted:rgba(255,255,255,.46);--text:#f7f7f7;--accent:#ffd400}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif}
    body{overflow-x:hidden;-webkit-font-smoothing:antialiased}
    button,input{font:inherit}
    button{color:inherit}
    button:focus-visible,input:focus-visible{outline:2px solid rgba(255,255,255,.45);outline-offset:2px}
    .app{min-height:100vh;background:linear-gradient(180deg,#080808 0,#060606 35%,#050505 100%)}

    .top{position:sticky;top:0;z-index:20;padding:14px 14px 11px;background:rgba(6,6,6,.9);border-bottom:1px solid rgba(255,255,255,.045);backdrop-filter:blur(22px) saturate(1.15)}
    .eyebrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
    .brand{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:760;letter-spacing:-.018em}
    .mark{width:20px;height:20px;border:1px solid rgba(255,255,255,.14);border-radius:7px;display:grid;place-items:center;background:#101010;box-shadow:inset 0 0 0 1px rgba(255,255,255,.025)}
    .mark:after{content:"";width:7px;height:7px;border-radius:2.5px;background:var(--accent)}
    .badge{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.28);font-weight:800}
    .searchWrap{display:flex;gap:8px}
    .search{flex:1;height:43px;border:1px solid var(--line);border-radius:13px;background:#0d0d0d;color:#fff;padding:0 14px;outline:none;transition:.18s}
    .search:focus{border-color:rgba(255,255,255,.2);background:#111}
    .search::placeholder{color:rgba(255,255,255,.24)}
    .go{height:43px;min-width:48px;border:0;border-radius:13px;background:#f3f3f3;color:#050505;font-weight:850;cursor:pointer;transition:.16s}
    .go:active,.primary:active,.iconBtn:active,.roundBtn:active{transform:scale(.96)}
    .content{padding:4px 14px 20px}
    .sectionHead{display:flex;align-items:end;justify-content:space-between;margin:13px 0 10px}
    .sectionHead h2{font-size:13px;margin:0;letter-spacing:-.018em}
    .sectionHead span{font-size:9px;color:var(--muted)}
    .empty{padding:44px 20px;text-align:center;border:1px solid rgba(255,255,255,.06);border-radius:17px;background:#0a0a0a}
    .empty strong{display:block;font-size:14px;margin-bottom:6px}
    .empty p{margin:0;font-size:11px;line-height:1.55;color:var(--muted)}
    .list{display:grid;gap:8px}
    .result{display:flex;gap:11px;width:100%;min-height:82px;padding:8px;border:1px solid rgba(255,255,255,.065);border-radius:15px;background:#0a0a0a;text-align:left;cursor:pointer;transition:.18s}
    .result:hover{background:#0f0f0f;border-color:rgba(255,255,255,.12);transform:translateY(-1px)}
    .poster{width:48px;height:66px;flex:0 0 auto;border-radius:10px;object-fit:cover;background:#151515}
    .resultCopy{min-width:0;padding:4px 2px}
    .resultTitle{display:block;font-size:12px;font-weight:760;letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .resultMeta{display:block;font-size:9px;color:rgba(255,255,255,.34);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}
    .resultOverview{display:-webkit-box;font-size:10px;line-height:1.45;color:rgba(255,255,255,.38);margin-top:6px;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:48px 0;color:rgba(255,255,255,.48);font-size:11px}
    .spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.14);border-top-color:#fff;border-radius:50%;animation:spin .76s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .detail{padding-bottom:24px;background:#060606}
    .hero{position:relative;height:222px;overflow:hidden;background:#101010}
    .hero img{width:100%;height:100%;object-fit:cover;transform:scale(1.01)}
    .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,6,6,.08),rgba(6,6,6,.18) 35%,#060606 100%),linear-gradient(90deg,rgba(6,6,6,.45),transparent 72%)}
    .back{position:absolute;left:12px;top:12px;z-index:3;width:36px;height:36px;border:1px solid rgba(255,255,255,.12);border-radius:11px;background:rgba(7,7,7,.6);backdrop-filter:blur(18px);cursor:pointer;font-size:20px}
    .detailBody{position:relative;margin-top:-48px;padding:0 14px;z-index:3}
    .detailPoster{width:76px;height:110px;border-radius:13px;object-fit:cover;border:1px solid rgba(255,255,255,.12);box-shadow:0 16px 40px rgba(0,0,0,.44);background:#111}
    .detailTop{display:flex;align-items:end;gap:12px}
    .detailCopy{min-width:0;padding-bottom:2px}
    .detailTitle{font-size:22px;line-height:1.02;font-weight:790;letter-spacing:-.045em;margin:0}
    .detailMeta{margin-top:7px;font-size:9px;color:rgba(255,255,255,.4);letter-spacing:.035em}
    .overview{margin:15px 0 0;font-size:11px;line-height:1.62;color:rgba(255,255,255,.48)}
    .episodeRow{display:flex;gap:8px;margin-top:15px}
    .miniField{flex:1}
    .miniField label{display:block;font-size:8px;color:rgba(255,255,255,.29);margin:0 0 6px 2px;text-transform:uppercase;letter-spacing:.11em;font-weight:800}
    .miniField input{width:100%;height:38px;border:1px solid var(--line);border-radius:11px;background:#0d0d0d;color:#fff;padding:0 11px;outline:none}
    .primary{width:100%;height:45px;margin-top:15px;border:0;border-radius:13px;background:#f2f2f2;color:#050505;font-weight:850;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px}
    .primary .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
    .subtle{margin-top:9px;text-align:center;font-size:8px;letter-spacing:.04em;color:rgba(255,255,255,.23)}

    /* Flagship mini player */
    .playerPage{min-height:100vh;background:#050505;display:flex;flex-direction:column}
    .stage{position:relative;width:100%;aspect-ratio:16/9;min-height:238px;background:#000;display:grid;place-items:center;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.06)}
    video{width:100%;height:100%;object-fit:contain;background:#000}
    .stageShade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.58) 0,transparent 28%,transparent 54%,rgba(0,0,0,.8) 100%)}
    .playerChrome{position:absolute;inset:0;z-index:4;transition:opacity .2s ease}
    .playerChrome.is-hidden{opacity:0;pointer-events:none}
    .playerChromeTop{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:9px;padding:11px 11px 0}
    .roundBtn{display:grid;place-items:center;width:36px;height:36px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(10,10,10,.5);backdrop-filter:blur(16px);cursor:pointer;color:#fff}
    .roundBtn svg,.iconBtn svg,.centerPlay svg{width:17px;height:17px;display:block}
    .now{min-width:0}
    .now strong{display:block;font-size:11px;font-weight:760;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .now span{display:block;margin-top:2px;font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.44)}
    .quality{height:26px;display:flex;align-items:center;padding:0 9px;border:1px solid rgba(255,255,255,.13);border-radius:9px;background:rgba(10,10,10,.5);backdrop-filter:blur(16px);font-size:8px;font-weight:850;letter-spacing:.08em;color:rgba(255,255,255,.78)}
    .centerPlay{position:absolute;left:50%;top:50%;z-index:5;transform:translate(-50%,-50%);width:54px;height:54px;border:1px solid rgba(255,255,255,.16);border-radius:50%;display:none;place-items:center;background:rgba(8,8,8,.64);backdrop-filter:blur(18px);cursor:pointer;box-shadow:0 12px 34px rgba(0,0,0,.34)}
    .centerPlay.is-visible{display:grid}
    .centerPlay svg{width:21px;height:21px;margin-left:2px}
    .playerOverlay{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .status{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid rgba(255,255,255,.09);border-radius:11px;background:rgba(8,8,8,.7);backdrop-filter:blur(18px);font-size:9px;color:rgba(255,255,255,.76)}
    .controls{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:28px 12px 11px;background:linear-gradient(transparent,rgba(0,0,0,.85) 48%,rgba(0,0,0,.96))}
    .timelineWrap{position:relative;height:14px;display:flex;align-items:center}
    .timeline{position:relative;z-index:2;width:100%;appearance:none;height:3px;background:linear-gradient(90deg,#fff var(--progress,0%),rgba(255,255,255,.22) var(--progress,0%));border-radius:999px;outline:none;cursor:pointer}
    .timeline::-webkit-slider-thumb{appearance:none;width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
    .controlRow{display:flex;align-items:center;justify-content:space-between;margin-top:5px}
    .leftControls,.rightControls{display:flex;align-items:center;gap:6px}
    .iconBtn{display:grid;place-items:center;width:31px;height:31px;border:0;border-radius:9px;background:transparent;color:#fff;cursor:pointer}
    .iconBtn:hover{background:rgba(255,255,255,.09)}
    .iconBtn:disabled{opacity:.25;cursor:default}
    .time{font-size:8px;color:rgba(255,255,255,.6);min-width:72px;font-variant-numeric:tabular-nums}
    .volume{width:58px;height:3px;accent-color:#fff}
    .playerSheet{padding:15px 14px 22px;background:linear-gradient(180deg,#090909,#060606)}
    .playingEyebrow{display:flex;align-items:center;gap:7px;font-size:8px;font-weight:850;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.28)}
    .playingEyebrow:before{content:"";width:6px;height:6px;border-radius:2px;background:var(--accent)}
    .playerSheetTop{display:flex;gap:11px;align-items:center;margin-top:11px}
    .playerMiniPoster{width:50px;height:72px;border-radius:10px;object-fit:cover;background:#111;border:1px solid rgba(255,255,255,.08)}
    .playerMeta{min-width:0}
    .playerMeta h3{margin:0;font-size:17px;line-height:1.06;letter-spacing:-.035em}
    .playerMetaLine{margin-top:6px;font-size:9px;color:rgba(255,255,255,.38);text-transform:uppercase;letter-spacing:.06em}
    .playerOverview{margin:11px 0 0;font-size:10px;line-height:1.56;color:rgba(255,255,255,.38)}
    .playerUtility{display:flex;gap:7px;margin-top:13px}
    .utilityPill{height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border:1px solid rgba(255,255,255,.075);border-radius:10px;background:#0d0d0d;font-size:9px;color:rgba(255,255,255,.48)}
    .utilityPill strong{color:rgba(255,255,255,.78);font-weight:760}
    .error{margin:14px;padding:12px;border:1px solid rgba(255,100,100,.16);border-radius:13px;background:rgba(255,70,70,.05);font-size:10px;line-height:1.5;color:rgba(255,255,255,.7)}
    .retry{margin-top:9px;border:0;border-radius:9px;padding:8px 10px;background:#fff;color:#000;font-weight:780;cursor:pointer}
    @media(max-width:370px){.volume{display:none}.detailTitle{font-size:19px}.stage{min-height:208px}.playerSheet{padding-left:12px;padding-right:12px}}
  
    /* V2 shell rework */
    .app{position:relative;min-height:100vh;background:
      radial-gradient(circle at 92% -8%,rgba(255,212,0,.055),transparent 25%),
      linear-gradient(180deg,#080808 0%,#050505 55%,#040404 100%)}
    .viewEnter{animation:viewIn .32s cubic-bezier(.2,.75,.2,1) both}
    @keyframes viewIn{from{opacity:0;transform:translateY(7px) scale(.995)}to{opacity:1;transform:none}}

    .appBar{position:sticky;top:0;z-index:30;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(6,6,6,.78);border-bottom:1px solid rgba(255,255,255,.05);backdrop-filter:blur(24px) saturate(1.2)}
    .appBrand{display:flex;align-items:center;gap:9px;min-width:0}
    .appLogo{width:25px;height:25px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:linear-gradient(180deg,#141414,#0b0b0b);box-shadow:inset 0 1px rgba(255,255,255,.035)}
    .appLogo:after{content:"";width:8px;height:8px;border-radius:3px;background:var(--accent)}
    .appBrandCopy{min-width:0}
    .appBrandCopy strong{display:block;font-size:12px;line-height:1;font-weight:790;letter-spacing:-.025em}
    .appBrandCopy span{display:block;margin-top:4px;font-size:7px;font-weight:750;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.25)}
    .livePill{height:27px;display:flex;align-items:center;gap:6px;padding:0 9px;border:1px solid rgba(255,255,255,.075);border-radius:9px;background:rgba(255,255,255,.035);font-size:8px;font-weight:750;color:rgba(255,255,255,.47)}
    .livePill:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}

    .homeMain{padding:14px 14px 23px}
    .discoverHero{position:relative;overflow:hidden;padding:18px 16px 15px;border:1px solid rgba(255,255,255,.075);border-radius:19px;background:
      radial-gradient(circle at 88% 10%,rgba(255,212,0,.105),transparent 30%),
      linear-gradient(135deg,#101010,#090909 68%);box-shadow:0 20px 50px rgba(0,0,0,.18)}
    .discoverHero:after{content:"";position:absolute;width:150px;height:150px;right:-72px;top:-75px;border:1px solid rgba(255,255,255,.05);border-radius:50%}
    .heroKicker{position:relative;z-index:1;font-size:8px;font-weight:850;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.29)}
    .heroTitle{position:relative;z-index:1;margin:7px 0 0;max-width:285px;font-size:26px;line-height:.98;font-weight:790;letter-spacing:-.055em}
    .heroSubtitle{position:relative;z-index:1;margin:9px 0 0;max-width:310px;font-size:10px;line-height:1.5;color:rgba(255,255,255,.39)}
    .heroSearch{position:relative;z-index:2;display:flex;align-items:center;gap:8px;margin-top:15px;padding:5px 5px 5px 12px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(0,0,0,.32)}
    .searchGlyph{width:15px;height:15px;flex:0 0 auto;color:rgba(255,255,255,.32)}
    .heroSearch input{min-width:0;flex:1;height:34px;border:0;background:transparent;color:#fff;outline:none;font-size:11px}
    .heroSearch input::placeholder{color:rgba(255,255,255,.25)}
    .heroSearch button{height:34px;padding:0 13px;border:0;border-radius:10px;background:#f3f3f3;color:#050505;font-size:9px;font-weight:850;cursor:pointer}
    .quickMeta{position:relative;z-index:1;display:flex;align-items:center;gap:12px;margin-top:13px;font-size:8px;color:rgba(255,255,255,.25)}
    .quickMeta span{display:flex;align-items:center;gap:5px}
    .quickMeta i{display:block;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.27)}

    .surfaceSection{margin-top:18px}
    .surfaceHead{display:flex;align-items:end;justify-content:space-between;margin-bottom:9px}
    .surfaceHead div strong{display:block;font-size:13px;letter-spacing:-.025em}
    .surfaceHead div span{display:block;margin-top:3px;font-size:8px;color:rgba(255,255,255,.28)}
    .surfaceCount{font-size:8px;font-weight:750;color:rgba(255,255,255,.26)}

    .recentRail{display:flex;gap:9px;overflow-x:auto;margin:0 -14px;padding:0 14px 5px;scrollbar-width:none;scroll-snap-type:x proximity}
    .recentRail::-webkit-scrollbar{display:none}
    .recentCard{width:102px;flex:0 0 102px;padding:0;border:0;background:transparent;text-align:left;cursor:pointer;scroll-snap-align:start}
    .recentPosterWrap{position:relative;width:102px;height:143px;overflow:hidden;border:1px solid rgba(255,255,255,.07);border-radius:13px;background:#111;transition:.2s ease}
    .recentCard:hover .recentPosterWrap{transform:translateY(-2px);border-color:rgba(255,255,255,.16)}
    .recentPosterWrap img{width:100%;height:100%;object-fit:cover}
    .recentType{position:absolute;left:7px;bottom:7px;height:20px;display:flex;align-items:center;padding:0 7px;border:1px solid rgba(255,255,255,.1);border-radius:7px;background:rgba(5,5,5,.68);backdrop-filter:blur(12px);font-size:7px;font-weight:850;letter-spacing:.07em;text-transform:uppercase}
    .recentName{display:block;margin-top:7px;font-size:10px;font-weight:730;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .recentYear{display:block;margin-top:3px;font-size:8px;color:rgba(255,255,255,.27)}

    .blankState{padding:20px 16px;border:1px solid rgba(255,255,255,.06);border-radius:15px;background:#090909}
    .blankState strong{font-size:12px}
    .blankState p{margin:5px 0 0;font-size:9px;line-height:1.55;color:rgba(255,255,255,.32)}

    .searchResultsHead{display:flex;align-items:center;justify-content:space-between;margin:19px 0 10px}
    .searchResultsHead strong{font-size:13px;letter-spacing:-.02em}
    .searchResultsHead span{font-size:8px;color:rgba(255,255,255,.28)}
    .mediaGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px 9px}
    .mediaCard{min-width:0;padding:0;border:0;background:transparent;text-align:left;cursor:pointer}
    .mediaPoster{position:relative;aspect-ratio:2/3;overflow:hidden;border:1px solid rgba(255,255,255,.065);border-radius:13px;background:#111;transition:.2s ease}
    .mediaCard:hover .mediaPoster{transform:translateY(-2px);border-color:rgba(255,255,255,.16)}
    .mediaPoster img{width:100%;height:100%;object-fit:cover}
    .mediaPosterShade{position:absolute;inset:0;background:linear-gradient(transparent 62%,rgba(0,0,0,.62));pointer-events:none}
    .mediaBadge{position:absolute;left:7px;bottom:7px;height:19px;display:flex;align-items:center;padding:0 7px;border:1px solid rgba(255,255,255,.1);border-radius:7px;background:rgba(5,5,5,.68);backdrop-filter:blur(12px);font-size:7px;font-weight:850;letter-spacing:.06em;text-transform:uppercase}
    .mediaTitle{display:block;margin-top:7px;font-size:10px;font-weight:740;letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mediaMeta{display:block;margin-top:3px;font-size:8px;color:rgba(255,255,255,.27)}

    .detailV2{min-height:100vh;background:#050505}
    .detailHeroV2{position:relative;height:272px;overflow:hidden;background:#111}
    .detailHeroV2>img{width:100%;height:100%;object-fit:cover;transform:scale(1.012)}
    .detailHeroV2:after{content:"";position:absolute;inset:0;background:
      linear-gradient(180deg,rgba(5,5,5,.12) 0%,rgba(5,5,5,.08) 35%,rgba(5,5,5,.56) 72%,#050505 100%),
      linear-gradient(90deg,rgba(5,5,5,.4),transparent 65%)}
    .detailBackV2{position:absolute;z-index:4;left:12px;top:12px;width:36px;height:36px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.12);border-radius:11px;background:rgba(5,5,5,.58);backdrop-filter:blur(16px);cursor:pointer}
    .detailBackV2 svg{width:17px;height:17px}
    .detailHeroInfo{position:absolute;z-index:3;left:14px;right:14px;bottom:18px}
    .detailHeroInfo .detailKicker{font-size:8px;font-weight:850;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.42)}
    .detailHeroInfo h1{margin:7px 0 0;max-width:340px;font-size:29px;line-height:.94;font-weight:790;letter-spacing:-.06em;text-wrap:balance}
    .detailFacts{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
    .factPill{height:24px;display:flex;align-items:center;padding:0 8px;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(8,8,8,.46);backdrop-filter:blur(12px);font-size:8px;font-weight:720;color:rgba(255,255,255,.67)}
    .detailSheetV2{position:relative;margin-top:-1px;padding:14px 14px 22px}
    .genreRow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
    .genreRow::-webkit-scrollbar{display:none}
    .genreChip{height:25px;display:flex;align-items:center;flex:0 0 auto;padding:0 9px;border:1px solid rgba(255,255,255,.07);border-radius:8px;background:#0b0b0b;font-size:8px;color:rgba(255,255,255,.4)}
    .detailOverviewV2{margin:13px 0 0;font-size:10px;line-height:1.62;color:rgba(255,255,255,.43)}
    .playPanel{margin-top:15px;padding:11px;border:1px solid rgba(255,255,255,.075);border-radius:15px;background:linear-gradient(180deg,#0d0d0d,#090909)}
    .playPanelTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .playPanelTop strong{font-size:10px}
    .playPanelTop span{font-size:7px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.24)}
    .episodePicker{display:grid;grid-template-columns:1fr 1fr;gap:7px}
    .episodePicker .miniField label{margin-bottom:5px}
    .episodePicker .miniField input{height:36px;background:#070707}

  <div id="app" class="app"></div>

  <script>
    (function(){
      "use strict";

      var API = "/api";
      var IMG = "https://image.tmdb.org/t/p";
      var app = document.getElementById("app");
      var currentDetail = null;
      var currentType = "movie";
      var currentId = null;
      var hls = null;
      var currentVideo = null;
      var activeStream = null;
      var lastSearch = "";
      var recentsKey = "synscraper_bookmark_recents_v1";
      var progressKey = "synscraper_bookmark_progress_v1";
      var ICON = {
        back:'<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        play:'<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 5.5v13l10-6.5-10-6.5z" fill="currentColor"/></svg>',
        pause:'<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 6v12M16 6v12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
        volume:'<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 10v4h3l4 3V7l-4 3H5zM15.5 9.5a4 4 0 010 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        mute:'<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 10v4h3l4 3V7l-4 3H5zM16 10l4 4m0-4l-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        captions:'<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5" stroke="currentColor" stroke-width="1.7"/><path d="M10 10a2 2 0 100 4M17 10a2 2 0 100 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
        pip:'<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5" stroke="currentColor" stroke-width="1.7"/><rect x="12.5" y="11.5" width="6" height="4.5" rx="1" fill="currentColor"/></svg>',
        fullscreen:'<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8.5 4.5h-4v4M15.5 4.5h4v4M8.5 19.5h-4v-4M15.5 19.5h4v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'
      };
      var playbackSeason = 1;
      var playbackEpisode = 1;
      var top10Items = [];
      var top10Index = 0;
      var top10Timer = null;
      var homeCatalog = [];
      var homeDataLoaded = false;


      function esc(value){
        return String(value == null ? "" : value)
          .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
          .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
      }

      function yearOf(item){
        return String(item.release_date || item.first_air_date || "").slice(0,4);
      }

      function titleOf(item){
        return item.title || item.name || "Untitled";
      }

      function image(path,size){
        return path ? IMG + "/" + (size || "w342") + path : "";
      }

      function formatTime(seconds){
        if(!isFinite(seconds) || seconds < 0) return "0:00";
        var total = Math.floor(seconds);
        var h = Math.floor(total/3600);
        var m = Math.floor((total%3600)/60);
        var s = total%60;
        return h ? h + ":" + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0") : m + ":" + String(s).padStart(2,"0");
      }

      async function getJSON(url){
        var response = await fetch(url,{headers:{"Accept":"application/json"}});
        if(!response.ok){
          var text = await response.text().catch(function(){return "";});
          throw new Error(text || ("Request failed (" + response.status + ")"));
        }
        return response.json();
      }

      function getRecents(){
        try{return JSON.parse(localStorage.getItem(recentsKey) || "[]");}catch(_){return [];}
      }

      function saveRecent(detail,type){
        var next = getRecents().filter(function(x){return !(String(x.id)===String(detail.id) && x.media_type===type);});
        next.unshift({
          id:detail.id,
          media_type:type,
          title:titleOf(detail),
          poster_path:detail.poster_path || "",
          backdrop_path:detail.backdrop_path || "",
          release_date:detail.release_date || "",
          first_air_date:detail.first_air_date || "",
          overview:detail.overview || ""
        });
        try{localStorage.setItem(recentsKey,JSON.stringify(next.slice(0,12)));}catch(_){}
      }

      function getProgressMap(){
        try{return JSON.parse(localStorage.getItem(progressKey) || "{}");}catch(_){return {};}
      }

      function progressId(type,id,season,episode){
        return [type,id,season||0,episode||0].join(":");
      }

      function saveProgress(type,id,season,episode,video){
        if(!video || !isFinite(video.currentTime) || !isFinite(video.duration) || video.duration < 10) return;
        var all = getProgressMap();
        all[progressId(type,id,season,episode)] = {position:video.currentTime,duration:video.duration,updated:Date.now()};
        try{localStorage.setItem(progressKey,JSON.stringify(all));}catch(_){}
      }

      function readProgress(type,id,season,episode){
        return getProgressMap()[progressId(type,id,season,episode)] || null;
      }

      function cleanupPlayer(){
        if(currentVideo && currentDetail){
          saveProgress(currentType,currentId,playbackSeason,playbackEpisode,currentVideo);
        }
        if(hls){try{hls.destroy();}catch(_){} hls=null;}
        if(currentVideo){try{currentVideo.pause();currentVideo.removeAttribute("src");currentVideo.load();}catch(_){}}
        currentVideo=null;
        activeStream=null;
      }

      function qualityScore(server){
        var q = String(server.quality || server.name || "").toLowerCase();
        var match = q.match(/(2160|1440|1080|720|480|360)/);
        var score = match ? Number(match[1]) : 0;
        if(/4k/.test(q)) score = Math.max(score,2160);
        if(server.type === "hls") score += 5;
        return score;
      }

          params.set("type",currentType);
          params.set("id",String(currentId));
          params.set("provider","vidy");
          params.set("mirror","miami");
          params.set("title",title);
          if(year) params.set("year",year);
          if(currentDetail.imdb_id) params.set("imdb_id",currentDetail.imdb_id);
          if(season) params.set("season",String(season));
          if(episode) params.set("episode",String(episode));

          var data = await getJSON(API + "/streams?" + params.toString());
          var servers = Array.isArray(data.servers) ? data.servers.slice() : [];
          if(!servers.length) throw new Error("No playable stream was returned.");
          servers.sort(function(a,b){return qualityScore(b)-qualityScore(a);});
          activeStream = servers[0];
          attachStream(activeStream,season,episode);
        }catch(error){
          showPlayerError(error.message || "Playback could not start.",season,episode);

      function attachStream(server,season,episode){
        var video = currentVideo;
        if(!video) return;
        var url = server.play_url;
        if(!url) return showPlayerError("The selected stream did not include a playback URL.",season,episode);

        var qualityText = String(server.quality || "AUTO").toUpperCase();
        document.getElementById("qualityLabel").textContent = qualityText;
        var utilityQuality = document.getElementById("utilityQuality");
        if(utilityQuality) utilityQuality.textContent = qualityText;
        var canNative = !!video.canPlayType("application/vnd.apple.mpegurl");
        var likelyHls = server.type === "hls" || /\.m3u8(?:$|\?)/i.test(url);

        function ready(){
          var overlay = document.getElementById("overlay");
          if(overlay) overlay.style.display = "none";
          var saved = readProgress(currentType,currentId,season,episode);
          if(saved && saved.position > 10 && (!video.duration || saved.position < video.duration-20)){
            try{video.currentTime=saved.position;}catch(_){}
          }
          video.play().catch(function(){});
        }

        video.addEventListener("loadedmetadata",ready,{once:true});
        video.addEventListener("canplay",ready,{once:true});

        if(likelyHls && !canNative && window.Hls && window.Hls.isSupported()){
          hls = new window.Hls({
            enableWorker:true,
            lowLatencyMode:false,
            backBufferLength:60,
            maxBufferLength:30,
            maxMaxBufferLength:75
          });
          hls.loadSource(url);
          hls.attachMedia(video);
          hls.on(window.Hls.Events.ERROR,function(_event,data){
            if(!data || !data.fatal) return;
            if(data.type === window.Hls.ErrorTypes.NETWORK_ERROR){try{hls.startLoad();return;}catch(_){}}
            if(data.type === window.Hls.ErrorTypes.MEDIA_ERROR){try{hls.recoverMediaError();return;}catch(_){}}
            showPlayerError("The stream became unavailable.",season,episode);
          });
        }else{
          video.src = url;
          video.load();
        }

        var captions = Array.isArray(server.captions) ? server.captions : [];
        captions.slice(0,4).forEach(function(caption,index){
          if(!caption.play_url) return;
          var track = document.createElement("track");
          track.kind = "subtitles";
          track.src = caption.play_url;
          track.srclang = caption.lang || "en";
          track.label = caption.name || caption.lang || ("Track " + (index+1));
          video.appendChild(track);
        });
        var captionsButton = document.getElementById("captions");
        if(captionsButton) captionsButton.disabled = captions.length === 0;
      }

      function wirePlayerControls(season,episode){
        var video = currentVideo;
        var stage = document.getElementById("stage");
        var chrome = document.getElementById("playerChrome");
        var centerPlay = document.getElementById("centerPlay");
        var play = document.getElementById("playPause");
        var mute = document.getElementById("mute");
        var captions = document.getElementById("captions");
        var pip = document.getElementById("pip");
        var timeline = document.getElementById("timeline");
        var timeLabel = document.getElementById("timeLabel");
        var fullscreen = document.getElementById("fullscreen");
        var hideTimer = null;
        var captionsOn = false;

        function reveal(){
          if(!chrome) return;
          chrome.classList.remove("is-hidden");
          clearTimeout(hideTimer);
          if(video && !video.paused){
            hideTimer = setTimeout(function(){
              if(video && !video.paused && !video.seeking) chrome.classList.add("is-hidden");
            },2300);
          }
        }

        function sync(){
          if(!video) return;
          var duration = isFinite(video.duration) ? video.duration : 0;
          var current = isFinite(video.currentTime) ? video.currentTime : 0;
          var pct = duration > 0 ? Math.max(0,Math.min(100,current/duration*100)) : 0;
          if(duration > 0) timeline.value = String(Math.max(0,Math.min(1000,current/duration*1000)));
          timeline.style.setProperty("--progress",pct + "%");
          timeLabel.textContent = formatTime(current) + " / " + formatTime(duration);
          play.innerHTML = video.paused ? ICON.play : ICON.pause;
          centerPlay.classList.toggle("is-visible",video.paused && duration > 0);
          centerPlay.innerHTML = ICON.play;
          mute.innerHTML = video.muted || video.volume === 0 ? ICON.mute : ICON.volume;
        }

        function togglePlayback(){
          reveal();
          video.paused ? video.play().catch(function(){}) : video.pause();
        }

        play.onclick = togglePlayback;
        centerPlay.onclick = togglePlayback;
        video.onclick = togglePlayback;

        stage.addEventListener("pointermove",reveal,{passive:true});
        stage.addEventListener("pointerdown",reveal,{passive:true});
        stage.addEventListener("mouseleave",function(){
          if(video && !video.paused) chrome.classList.add("is-hidden");
        });

        video.addEventListener("play",function(){sync();reveal();});
        video.addEventListener("pause",function(){sync();reveal();});
        video.addEventListener("timeupdate",function(){sync();saveProgress(currentType,currentId,season,episode,video);});
        video.addEventListener("durationchange",sync);
        video.addEventListener("waiting",function(){
          reveal();
          var overlay = document.getElementById("overlay");
          if(overlay){overlay.style.display="flex";document.getElementById("status").innerHTML='<span class="spin"></span>Buffering';}
        });
        video.addEventListener("playing",function(){
          var overlay=document.getElementById("overlay");
          if(overlay) overlay.style.display="none";
          sync();
          reveal();
        });
        video.addEventListener("error",function(){showPlayerError("Playback stopped unexpectedly.",season,episode);});

        timeline.oninput = function(){
          reveal();
          if(isFinite(video.duration) && video.duration>0) video.currentTime = Number(timeline.value)/1000*video.duration;
          sync();
        };

        mute.onclick = function(){
          video.muted = !video.muted;
          sync();
          reveal();
        };

        captions.onclick = function(){
          if(!video.textTracks || !video.textTracks.length) return;
          captionsOn = !captionsOn;
          Array.prototype.forEach.call(video.textTracks,function(track,index){
            track.mode = captionsOn && index === 0 ? "showing" : "disabled";
          });
          captions.style.background = captionsOn ? "rgba(255,255,255,.14)" : "transparent";
          reveal();
        };

        if(!document.pictureInPictureEnabled || !video.requestPictureInPicture) pip.disabled = true;
        pip.onclick = async function(){
          reveal();
          try{
            if(document.pictureInPictureElement) await document.exitPictureInPicture();
            else await video.requestPictureInPicture();
          }catch(_){}
        };

        fullscreen.onclick = function(){
          reveal();
          if(document.fullscreenElement){document.exitFullscreen().catch(function(){});}
          else if(stage && stage.requestFullscreen){stage.requestFullscreen().catch(function(){});}
          else if(video.webkitEnterFullscreen){video.webkitEnterFullscreen();}
        };

        sync();
      }

      function showPlayerError(message,season,episode){
        var overlay = document.getElementById("overlay");
        if(overlay) overlay.style.display = "none";
        var page = document.querySelector(".playerPage");
        if(!page) return;
        var old = page.querySelector(".error");
        if(old) old.remove();
        var box = document.createElement("div");
        box.className = "error";
        box.innerHTML = "Playback unavailable.<br>" + esc(message) + '<br><button class="retry">Retry</button>';
        box.querySelector(".retry").onclick = function(){
          cleanupPlayer();
          renderDetail();
          if(currentType==="tv"){
            document.getElementById("seasonField").value = season || 1;
            document.getElementById("episodeField").value = episode || 1;
          }
          playCurrent();
        };
        page.appendChild(box);
      }

      document.addEventListener("click",function(event){
        var result = event.target.closest && event.target.closest(".result");
        if(result && app.contains(result)){
          var type = result.getAttribute("data-type");
          var id = result.getAttribute("data-id");
          if(type && id) openDetail(type,id);
        }
      });

      document.addEventListener("keydown",function(event){
        if(!currentVideo) return;
        if(event.target && /input|textarea|select/i.test(event.target.tagName)) return;
        if(event.code==="Space"){
          event.preventDefault();
          currentVideo.paused ? currentVideo.play().catch(function(){}) : currentVideo.pause();
        }
        if(event.key==="ArrowRight") currentVideo.currentTime = Math.min(currentVideo.duration||Infinity,currentVideo.currentTime+10);
        if(event.key==="ArrowLeft") currentVideo.currentTime = Math.max(0,currentVideo.currentTime-10);
      });

      var qs = new URLSearchParams(location.search);
      var hinted = String(qs.get("q") || "").replace(/\s*[|–—-]\s*[^|–—-]{1,45}$/,"").trim();
      if(hinted && hinted.length < 90) lastSearch = hinted;
      renderHome();
      wireResults();
    })();
  </script>
</body>
</html>
