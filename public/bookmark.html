    #bookmark,#copy{

      border-radius:4px;
      font:700 13px/44px Arial,Helvetica,sans-serif;
      text-align:center;
      cursor:pointer;
    }
    #bookmark{
      flex:1;
      padding:0 18px;
      background:#181818;
      color:#fff;
      text-decoration:none;
      cursor:grab;
      user-select:none;
    }
    #bookmark:active{cursor:grabbing}
    #copy{width:112px;padding:0 14px;background:transparent;color:#181818}
    #copy:hover{background:#e8e5df}
    #bookmark:hover{background:#000}
    @media(max-width:420px){
      body{padding:18px}
      h1{font-size:24px;margin-bottom:20px}
      .row{display:grid}
      #copy{width:100%}
    }
