name: One-time Vercel static build

on:
  push:
    paths:
      - '.github/vercel-static-trigger'

permissions:
  contents: write

jobs:
  build-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend
        run: yarn --cwd frontend install
      - name: Build frontend
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
        run: yarn --cwd frontend build
      - name: Commit deploy-ready static output
        run: |
          rm -rf public backend/public
          cp -R frontend/build public
          cp -R frontend/build backend/public
          test -f public/index.html
          test -f backend/public/index.html
          git config user.name 'Polaris'
          git config user.email '264532369+lauraevan@users.noreply.github.com'
          git add -f public backend/public
          git commit -m 'Commit deploy-ready SynPlayer static build'
          git push
