name: Direct Vercel prebuild

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'

permissions:
  contents: write

concurrency:
  group: synscraper-vercel-prebuild
  cancel-in-progress: true

jobs:
  prebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Yarn
        run: npm install -g yarn@1.22.22
      - name: Install frontend
        run: yarn --cwd frontend install --frozen-lockfile
      - name: Build frontend
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
        run: yarn --cwd frontend build
      - name: Commit compiled public bundle
        shell: bash
        run: |
          rm -rf public
          cp -R frontend/build public
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('package.json')
          data = json.loads(p.read_text())
          data.setdefault('scripts', {})['build'] = 'test -f public/index.html'
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
          if git diff --quiet -- public package.json; then
            echo "Compiled public bundle is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public package.json
          git commit -m "Prebuild current SynPlayer bundle"
          git push origin HEAD:main
