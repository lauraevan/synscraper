name: One-time Vercel resolver deployment

on:
  push:
    paths:
      - '.github/vercel-resolver-fix-trigger'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not configured in GitHub Actions" >&2
            exit 2
          fi
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Link existing SynPlayer project
        working-directory: backend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel link --yes --project synplayer-zen-rock --scope atop5 --token "$VERCEL_TOKEN"
      - name: Deploy resolver fixes to production
        working-directory: backend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --yes --scope atop5 --token "$VERCEL_TOKEN"
