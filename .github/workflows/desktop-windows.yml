name: Build SynFlix Desktop

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - "frontend/src/App.js"
      - "frontend/src/components/Desktop*.jsx"
      - "frontend/src/pages/desktop/**"
      - "frontend/src/desktop*.css"
      - "frontend/src/lib/api.js"
      - ".github/workflows/desktop-windows.yml"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Create Windows app icon from SynFlix logo
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python -c "from pathlib import Path; from PIL import Image; p=Path('desktop/src-tauri/icons'); p.mkdir(parents=True, exist_ok=True); im=Image.open('frontend/public/synflix-logo.webp').convert('RGBA'); im.save(p/'icon.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)]); im.resize((512,512), Image.Resampling.LANCZOS).save(p/'icon.png')"

      - name: Install frontend dependencies
        shell: pwsh
        run: yarn --cwd frontend install

      - name: Install Tauri CLI
        shell: pwsh
        run: npm --prefix desktop install

      - name: Build SynFlix Windows installer
        working-directory: desktop
        shell: pwsh
        env:
          CI: "false"
        run: npm run build

      - name: Stage stable installer name
        shell: pwsh
        run: |
          $installer = Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis/*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "SynFlix NSIS installer was not produced." }
          Copy-Item $installer.FullName "SynFlix-Setup.exe" -Force

      - name: Upload SynFlix installer
        uses: actions/upload-artifact@v4
        with:
          name: SynFlix-Desktop-v1-Windows
          path: SynFlix-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable desktop download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create desktop-latest --title "SynFlix Desktop" --notes "Rolling Windows installer for SynFlix Desktop." --target "${{ github.sha }}"
          }
          gh release upload desktop-latest "SynFlix-Setup.exe" --clobber
