name: Build SynFlix Desktop

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - "frontend/src/App.js"
      - "frontend/src/components/DesktopShell.jsx"
      - "frontend/src/desktop-app.css"
      - "frontend/src/lib/api.js"
      - ".github/workflows/desktop-windows.yml"

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install frontend dependencies
        shell: pwsh
        run: yarn --cwd frontend install

      - name: Install Tauri CLI
        shell: pwsh
        run: npm --prefix desktop install

      - name: Build SynFlix Windows installer
        working-directory: desktop
        shell: pwsh
        env:
          CI: "false"
        run: npm run build

      - name: Upload SynFlix installer
        uses: actions/upload-artifact@v4
        with:
          name: SynFlix-Desktop-v1-Windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
