name: Diagnose Vidy Miami latency

on:
  push:
    paths:
      - '.github/workflows/diagnose-miami.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements.txt
      - name: Measure Miami resolution and signed-link metadata
        run: |
          python - <<'PY'
          import json, sys, time
          from urllib.parse import urlparse, parse_qs
          from urllib.request import Request, urlopen
          sys.path.insert(0, 'backend')
          from providers.vidy import VidyResolver

          report = []
          for run in range(3):
              t0 = time.perf_counter()
              data = json.loads(VidyResolver().resolve('550', media_type='movie', provider='miami'))
              elapsed = round(time.perf_counter() - t0, 3)
              items = data.get('playable_urls') or []
              row = {
                  'run': run + 1,
                  'status': data.get('status'),
                  'resolve_seconds': elapsed,
                  'count': len(items),
                  'qualities': [str(x.get('quality')) for x in items],
              }
              if items:
                  first = items[0]
                  url = first.get('url') or ''
                  qs = parse_qs(urlparse(url).query)
                  row['query_keys'] = sorted(qs.keys())
                  now = int(time.time())
                  expiry = None
                  for key in ('expires', 'expire', 'exp', 'e'):
                      raw = (qs.get(key) or [None])[0]
                      if raw and str(raw).isdigit():
                          val = int(raw)
                          if val > 1_000_000_000:
                              expiry = val - now
                              break
                  row['expiry_seconds_if_obvious'] = expiry
                  headers = first.get('headers') or {}
                  req = Request(url, headers={
                      'User-Agent': headers.get('User-Agent') or 'Mozilla/5.0',
                      'Referer': headers.get('Referer') or 'https://www.vidy.st/',
                      'Origin': headers.get('Origin') or 'https://www.vidy.st',
                      'Accept': '*/*',
                  })
                  mt0 = time.perf_counter()
                  try:
                      with urlopen(req, timeout=12) as r:
                          chunk = r.read(2048)
                          row['manifest_status'] = r.status
                          row['manifest_seconds'] = round(time.perf_counter() - mt0, 3)
                          row['manifest_bytes_sampled'] = len(chunk)
                  except Exception as exc:
                      row['manifest_error'] = type(exc).__name__
                      row['manifest_seconds'] = round(time.perf_counter() - mt0, 3)
              report.append(row)
          print(json.dumps(report, indent=2))
          if not any(x.get('status') == 'success' and x.get('count', 0) for x in report):
              raise SystemExit('Miami did not resolve in any diagnostic run')
          PY