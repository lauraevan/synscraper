name: Optimize Vidy Miami startup

on:
  push:
    paths:
      - '.github/workflows/optimize-vidy-miami.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch Vidy latency, provider deadline, and HLS recovery
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'{label}: pattern not found')
              return text.replace(old, new, 1)

          for path in ('backend/providers/vidy.py', 'synflix_scrapers/vidy.py'):
              p = Path(path)
              s = p.read_text()
              s = s.replace('__version__ = "0.3.0"', '__version__ = "0.3.1"', 1)
              s = replace_once(
                  s,
                  '        accept: str = "application/json,text/plain,*/*",\n    ) -> Any:',
                  '        accept: str = "application/json,text/plain,*/*",\n        timeout: float = 25.0,\n    ) -> Any:',
                  f'{path} request timeout parameter',
              )
              s = replace_once(
                  s,
                  'with urllib.request.urlopen(req, timeout=25, context=self.ssl_context) as response:',
                  'with urllib.request.urlopen(req, timeout=timeout, context=self.ssl_context) as response:',
                  f'{path} request timeout usage',
              )
              s = replace_once(
                  s,
                  'data = self._request(f"{API_BASE}/seed", params={"mediaId": int(media_id)})',
                  'data = self._request(f"{API_BASE}/seed", params={"mediaId": int(media_id)}, timeout=6.0)',
                  f'{path} seed timeout',
              )
              s = replace_once(
                  s,
                  'response = self._request(f"{API_BASE}/{provider}/sources", params=query)',
                  'response = self._request(f"{API_BASE}/{provider}/sources", params=query, timeout=6.5)',
                  f'{path} provider timeout',
              )
              s = replace_once(
                  s,
                  'with ThreadPoolExecutor(max_workers=min(5, len(providers))) as pool:',
                  'with ThreadPoolExecutor(max_workers=len(providers)) as pool:',
                  f'{path} provider concurrency',
              )
              p.write_text(s)

          # Do not let one dead provider stall every source in the selector.
          p = Path('backend/scraper.py')
          s = p.read_text()
          s = replace_once(
              s,
              '''    async def run(name, pid, cls):\n        streams = await asyncio.to_thread(_run_one, cls, media_type, tmdb_id, season, episode)\n        return name, pid, streams\n''',
              '''    async def run(name, pid, cls):\n        try:\n            streams = await asyncio.wait_for(\n                asyncio.to_thread(_run_one, cls, media_type, tmdb_id, season, episode),\n                timeout=10.0,\n            )\n        except (asyncio.TimeoutError, TimeoutError):\n            streams = []\n        return name, pid, streams\n''',
              'backend provider deadline',
          )
          p.write_text(s)

          # Player: Vidy mirrors without Auto should start at 1080p rather than forcing 2160p.
          p = Path('frontend/src/components/SynapsePlayer.jsx')
          s = p.read_text()
          s = replace_once(
              s,
              '    const hlsRef = useRef(null);\n',
              '    const hlsRef = useRef(null);\n    const hlsRetryRef = useRef({ serverId: null, network: 0, media: 0 });\n',
              'HLS retry ref',
          )
          s = replace_once(
              s,
              '''        setBuffering(true);\n        setLevels([]); setLevel(-1); setSubs([]); setSub(-1);\n''',
              '''        setBuffering(true);\n        hlsRetryRef.current = { serverId: server.id, network: 0, media: 0 };\n        setLevels([]); setLevel(-1); setSubs([]); setSub(-1);\n''',
              'reset HLS retries',
          )
          s = replace_once(
              s,
              '            const hls = new Hls({ enableWorker: true, maxBufferLength: 30 });',
              '''            const hls = new Hls({\n                enableWorker: true,\n                startFragPrefetch: true,\n                maxBufferLength: 45,\n                maxMaxBufferLength: 90,\n                manifestLoadingTimeOut: 10000,\n                manifestLoadingMaxRetry: 3,\n                manifestLoadingRetryDelay: 350,\n                levelLoadingTimeOut: 10000,\n                levelLoadingMaxRetry: 3,\n                levelLoadingRetryDelay: 350,\n                fragLoadingTimeOut: 20000,\n                fragLoadingMaxRetry: 4,\n                fragLoadingRetryDelay: 350,\n            });''',
              'HLS startup configuration',
          )
          s = replace_once(
              s,
              '            hls.on(Hls.Events.ERROR, (_e, data) => { if (data.fatal) tryNext(server.id); });',
              '''            hls.on(Hls.Events.ERROR, (_e, data) => {\n                if (!data.fatal) return;\n                const retries = hlsRetryRef.current;\n                if (retries.serverId !== server.id) return;\n                if (data.type === Hls.ErrorTypes.NETWORK_ERROR && retries.network < 2) {\n                    retries.network += 1;\n                    const delay = 300 * retries.network;\n                    window.setTimeout(() => {\n                        if (hlsRef.current !== hls) return;\n                        if (data.details === Hls.ErrorDetails.MANIFEST_LOAD_ERROR || data.details === Hls.ErrorDetails.MANIFEST_LOAD_TIMEOUT) {\n                            hls.loadSource(url);\n                        } else {\n                            hls.startLoad();\n                        }\n                    }, delay);\n                    return;\n                }\n                if (data.type === Hls.ErrorTypes.MEDIA_ERROR && retries.media < 1) {\n                    retries.media += 1;\n                    hls.recoverMediaError();\n                    return;\n                }\n                tryNext(server.id);\n            });''',
              'HLS fatal recovery',
          )
          old_score = '''            const score = /^auto/i.test(String(server.quality || "")) ? 100000 : qualityHeight(server.quality);\n            const existingScore = existing ? (/^auto/i.test(String(existing.quality || "")) ? 100000 : qualityHeight(existing.quality)) : -1;\n'''
          new_score = '''            const sourceScore = (candidate) => {\n                if (/^auto/i.test(String(candidate?.quality || ""))) return 100000;\n                const height = qualityHeight(candidate?.quality);\n                if (source.provider === "vidy" && height === 1080) return 90000;\n                return height;\n            };\n            const score = sourceScore(server);\n            const existingScore = existing ? sourceScore(existing) : -1;\n'''
          s = replace_once(s, old_score, new_score, 'Vidy 1080 default score')
          p.write_text(s)
          PY

      - name: Live-check Miami and compile backend
        run: |
          python -m pip install -q -r requirements.txt
          python -m py_compile backend/providers/vidy.py backend/scraper.py
          python - <<'PY'
          import json, sys, time
          sys.path.insert(0, 'backend')
          from providers.vidy import VidyResolver

          t0 = time.perf_counter()
          miami = json.loads(VidyResolver().resolve('550', media_type='movie', provider='miami'))
          elapsed = time.perf_counter() - t0
          qualities = [str(x.get('quality')) for x in miami.get('playable_urls', [])]
          print(json.dumps({
              'status': miami.get('status'),
              'seconds': round(elapsed, 3),
              'qualities': qualities,
              'count': len(miami.get('playable_urls', [])),
          }, indent=2))
          if miami.get('status') != 'success':
              raise SystemExit('Miami resolution failed')
          if '1080p' not in qualities or '2160p' not in qualities:
              raise SystemExit('Miami expected qualities missing')
          if elapsed > 8.0:
              raise SystemExit(f'Miami resolution unexpectedly slow: {elapsed:.2f}s')
          PY

      - name: Build frontend
        run: |
          yarn --cwd frontend install --non-interactive
          CI=false REACT_APP_BACKEND_URL='' yarn --cwd frontend build
          rm -rf public backend/public
          cp -a frontend/build public
          cp -a frontend/build backend/public

      - name: Commit optimized Miami path
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/providers/vidy.py synflix_scrapers/vidy.py backend/scraper.py frontend/src/components/SynapsePlayer.jsx public backend/public
          git commit -m 'Make Vidy Miami startup faster and more reliable'
          git push