name: One-time Settings VTT Granite upgrade

on:
  push:
    branches: [main]
    paths:
      - ".github/settings-vtt-granite-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch settings and subtitle system
        run: python .github/scripts/settings_vtt_granite_upgrade.py

      - name: Validate backend
        run: python -m py_compile backend/server.py backend/scraper.py backend/providers/*.py

      - name: Validate frontend production build
        run: |
          cd frontend
          yarn install --frozen-lockfile
          yarn build

      - name: Commit upgrade
        run: |
          git config user.name "Synapse Bot"
          git config user.email "264532369+lauraevan@users.noreply.github.com"
          git add frontend/src/components/SynapsePlayer.jsx backend/server.py
          git commit -m "Rework settings and add VTT Granite subtitles"
          git push
