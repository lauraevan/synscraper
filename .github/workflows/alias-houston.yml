name: Alias former Orbit mirror as Houston

on:
  push:
    paths:
      - '.github/workflows/alias-houston.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch alias
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/scraper.py')
          t = p.read_text()
          old = '''            if subserver:\n                if pid == "vidzee":\n                    display_name = {\n                        "dcloud": "DCloud",\n                        "tik": "Tik",\n                        "ipcloud": "IPCloud",\n                        "v6:hindi": "V6 Hindi",\n                    }.get(subserver.lower(), subserver)\n                else:\n                    display_name = subserver\n'''
          new = '''            if subserver:\n                if pid == "vidzee":\n                    display_name = {\n                        "dcloud": "DCloud",\n                        "tik": "Tik",\n                        "ipcloud": "IPCloud",\n                        "v6:hindi": "V6 Hindi",\n                    }.get(subserver.lower(), subserver)\n                elif pid == "castle" and subserver.lower() == "castle":\n                    display_name = "Houston"\n                else:\n                    display_name = subserver\n'''
          assert old in t
          p.write_text(t.replace(old, new, 1))
          PY
          python -m py_compile backend/scraper.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/scraper.py
          git commit -m "Show the former Orbit source as Houston"
          git push
