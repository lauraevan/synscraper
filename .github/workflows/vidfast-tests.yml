name: VidFast resolver unit tests

on:
  push:
    paths:
      - "backend/providers/vidfast.py"
      - "backend/test_vidfast.py"
      - ".github/workflows/vidfast-tests.yml"
  pull_request:
    paths:
      - "backend/providers/vidfast.py"
      - "backend/test_vidfast.py"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install resolver dependencies
        run: python -m pip install requests curl_cffi httpx
      - name: Compile provider and run offline contract tests
        run: |
          python -m py_compile providers/vidfast.py test_vidfast.py
          python -m unittest -v test_vidfast

  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API probe dependencies
        run: python -m pip install requests curl_cffi
      - name: Resolve with documented API and report stage
        env:
          VIDFAST_BROWSER: "0"
          VIDFAST_API: "1"
        run: |
          python - <<'PY'
          import json
          from providers.vidfast import VidFastResolver
          result = json.loads(VidFastResolver(debug=True).resolve("550"))
          print("status:", result.get("status"))
          print("source_count:", len(result.get("playable_urls", [])))
          if result.get("status") != "success":
              raise SystemExit(1)
          from curl_cffi import requests as curl_requests
          playable = 0
          for index, stream in enumerate(result["playable_urls"]):
              try:
                  response = curl_requests.get(
                      stream["url"], headers=stream.get("headers", {}),
                      impersonate="chrome", timeout=9, stream=True,
                  )
                  try:
                      body = next(response.iter_content(chunk_size=2048), b"")
                      kind = stream.get("type", "unknown")
                      mime = response.headers.get("content-type", "").lower()
                      manifest_ok = body.lstrip().startswith(b"#EXTM3U")
                      ok = response.status_code in (200, 206) and (
                          (kind == "hls" and (manifest_ok or "mpegurl" in mime)) or
                          (kind == "mp4" and (b"ftyp" in body[:16] or "video/mp4" in mime))
                      )
                      print("source_probe:", index, "type:", kind,
                            "http:", response.status_code, "manifest_ok:", manifest_ok,
                            "valid:", ok)
                      playable += int(ok)
                  finally:
                      response.close()
              except Exception as exc:
                  print("source_probe:", index, "error:", type(exc).__name__)
          print("verified_playable_count:", playable)
          if playable == 0:
              raise SystemExit(1)
          # Follow the first playlist through variants, then test one media segment.
          from urllib.parse import urljoin
          current = result["playable_urls"][0]["url"]
          headers = result["playable_urls"][0].get("headers", {})
          segment_ok = False
          for depth in range(4):
              response = curl_requests.get(
                  current, headers={**headers, "Range": "bytes=0-1023"},
                  impersonate="chrome", timeout=10, stream=True,
              )
              try:
                  chunks = []
                  for chunk in response.iter_content(chunk_size=4096):
                      chunks.append(chunk)
                      if sum(map(len, chunks)) >= 32768:
                          break
                  head = b"".join(chunks)
                  if response.status_code not in (200, 206):
                      print("segment_probe_depth:", depth, "http:", response.status_code)
                      break
                  if head.lstrip().startswith(b"#EXTM3U"):
                      lines = head.decode("utf-8", errors="replace").splitlines()
                      next_path = next((line.strip() for line in lines
                          if line.strip() and not line.startswith("#")), None)
                      if not next_path:
                          break
                      current = urljoin(current, next_path)
                      print("playlist_depth:", depth, "http:", response.status_code)
                  else:
                      segment_ok = bool(head)
                      print("media_segment_probe:", "http:", response.status_code,
                            "bytes_sampled:", len(head), "valid:", segment_ok)
                      break
              finally:
                  response.close()
          if not segment_ok:
              raise SystemExit(1)
          # Confirm the actual SynScraper httpx proxy transport can fetch HLS.
          import httpx
          import scraper
          first = result["playable_urls"][0]
          proxy_headers = {
              "User-Agent": scraper.USER_AGENT, "Accept": "*/*",
              "Referer": first["headers"].get("Referer", ""),
              "Origin": first["headers"].get("Origin", ""),
          }
          try:
              response = httpx.get(first["url"], headers=proxy_headers, timeout=10)
              proxy_valid = response.status_code == 200 and response.content.lstrip().startswith(b"#EXTM3U")
              print("synscraper_httpx_probe:", response.status_code, "valid_hls:", proxy_valid)
              if not proxy_valid:
                  raise SystemExit(1)
          except httpx.HTTPError as exc:
              print("synscraper_httpx_probe_error:", type(exc).__name__)
              raise SystemExit(1)
          PY

  live-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser and requests
        run: |
          python -m pip install requests curl_cffi playwright
          python -m playwright install --with-deps chromium
      - name: Diagnose VidFast browser startup without exposing media URLs
        run: python scripts/vidfast_probe.py
      - name: Probe VidFast provider with real Chromium
        env:
          VIDFAST_BROWSER: "1"
        run: |
          python - <<'PY'
          import json
          from providers.vidfast import VidFastResolver
          result = json.loads(VidFastResolver(debug=True).resolve("550"))
          print("status:", result.get("status"))
          print("source_count:", len(result.get("playable_urls", [])))
          print("types:", sorted({s["type"] for s in result.get("playable_urls", [])}))
          if result.get("status") != "success":
              print("reason:", result.get("message"))
              raise SystemExit(1)
          PY
