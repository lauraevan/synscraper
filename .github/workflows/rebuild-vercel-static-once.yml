name: One-time rebuild Vercel static

on:
  push:
    paths:
      - '.github/rebuild-vercel-trigger'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: yarn --cwd frontend install
      - name: Build SynPlayer
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
        run: yarn --cwd frontend build
      - name: Commit static output
        run: |
          rm -rf public backend/public
          cp -R frontend/build public
          cp -R frontend/build backend/public
          test -f public/index.html
          test -f backend/public/index.html
          git config user.name 'Polaris'
          git config user.email '264532369+lauraevan@users.noreply.github.com'
          git add -f public backend/public
          git commit -m 'Rebuild SynPlayer static output with Zen and Rock'
          git push
