name: Apply PStream SynPlayer theme

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'Run PStream SynPlayer theme' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch player
        run: python scripts/apply_player_compact_perf.py
      - name: Validate React build
        run: |
          npm install -g yarn@1.22.22
          yarn --cwd frontend install --frozen-lockfile
          CI=false GENERATE_SOURCEMAP=false yarn --cwd frontend build
          grep -R "synplayer-label" frontend/build/static/js >/dev/null
          grep -R "synapse-friendly-subtitle-settings" frontend/build/static/js >/dev/null
          grep -R "Subtitle settings" frontend/build/static/js >/dev/null
          grep -R "#eadb8a" frontend/build/static/js >/dev/null
      - name: Commit player and production bundle
        run: |
          rm -rf public backend/public
          cp -R frontend/build public
          cp -R frontend/build backend/public
          python - <<'PY'
          import json
          from pathlib import Path
          package = Path('package.json')
          data = json.loads(package.read_text())
          data.setdefault('scripts', {})['build'] = 'test -f public/index.html'
          package.write_text(json.dumps(data, indent=2) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/SynapsePlayer.jsx public backend/public package.json
          git commit -m "Restyle SynPlayer with PStream-inspired theme"
          git pull --rebase origin main
          git push origin HEAD:main
