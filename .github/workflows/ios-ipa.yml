name: Build SynFlix iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - "frontend/src/App.js"
      - "frontend/src/ios-native.css"
      - ".github/workflows/ios-ipa.yml"

permissions:
  contents: write

jobs:
  ios-ipa:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build premium SynFlix app icon
        run: |
          python -m pip install --disable-pip-version-check pillow
          python <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFilter

          W = 1024
          out = Path('ios/SynFlix/Assets.xcassets/AppIcon.appiconset')
          out.mkdir(parents=True, exist_ok=True)

          # Full-bleed indigo/blue background. iOS applies its own icon mask.
          base = Image.new('RGBA', (W, W), (7, 9, 22, 255))
          d = ImageDraw.Draw(base)
          top = (18, 16, 46)
          bottom = (7, 11, 27)
          for y in range(W):
              t = y / (W - 1)
              color = tuple(round(top[i] * (1 - t) + bottom[i] * t) for i in range(3)) + (255,)
              d.line((0, y, W, y), fill=color)

          # Cinematic color bloom behind the mark.
          glow = Image.new('RGBA', (W, W), (0, 0, 0, 0))
          gd = ImageDraw.Draw(glow)
          gd.ellipse((-120, -180, 700, 650), fill=(112, 72, 255, 128))
          gd.ellipse((410, 360, 1160, 1110), fill=(38, 112, 255, 108))
          glow = glow.filter(ImageFilter.GaussianBlur(118))
          base = Image.alpha_composite(base, glow)

          # Large glass diamond — deliberately fills the icon instead of floating tiny in the middle.
          diamond = Image.new('RGBA', (570, 570), (0, 0, 0, 0))
          dd = ImageDraw.Draw(diamond)
          dd.rounded_rectangle((18, 18, 552, 552), radius=118, fill=(255, 255, 255, 28), outline=(255, 255, 255, 118), width=12)
          dd.rounded_rectangle((46, 46, 524, 524), radius=96, outline=(156, 139, 255, 118), width=5)
          diamond = diamond.rotate(45, expand=True, resample=Image.Resampling.BICUBIC)
          base.alpha_composite(diamond, ((W - diamond.width) // 2, (W - diamond.height) // 2))

          # Specular Liquid Glass highlight.
          shine = Image.new('RGBA', (W, W), (0, 0, 0, 0))
          sd = ImageDraw.Draw(shine)
          sd.ellipse((170, 105, 760, 500), fill=(255, 255, 255, 52))
          shine = shine.filter(ImageFilter.GaussianBlur(72))
          base = Image.alpha_composite(base, shine)

          # Bold play glyph, sized to read clearly even on the Home Screen.
          d = ImageDraw.Draw(base)
          shadow = Image.new('RGBA', (W, W), (0, 0, 0, 0))
          sh = ImageDraw.Draw(shadow)
          sh.polygon([(420, 336), (420, 688), (720, 512)], fill=(0, 0, 0, 92))
          shadow = shadow.filter(ImageFilter.GaussianBlur(24))
          base = Image.alpha_composite(base, shadow)
          d = ImageDraw.Draw(base)
          d.polygon([(414, 326), (414, 698), (728, 512)], fill=(255, 255, 255, 250))

          # Fine inner highlight gives the glyph a polished glass edge.
          d.line([(438, 365), (438, 646)], fill=(255, 255, 255, 220), width=7)

          specs = [
              ('iphone','20x20','2x',40), ('iphone','20x20','3x',60),
              ('iphone','29x29','2x',58), ('iphone','29x29','3x',87),
              ('iphone','40x40','2x',80), ('iphone','40x40','3x',120),
              ('iphone','60x60','2x',120), ('iphone','60x60','3x',180),
              ('ipad','20x20','1x',20), ('ipad','20x20','2x',40),
              ('ipad','29x29','1x',29), ('ipad','29x29','2x',58),
              ('ipad','40x40','1x',40), ('ipad','40x40','2x',80),
              ('ipad','76x76','1x',76), ('ipad','76x76','2x',152),
              ('ipad','83.5x83.5','2x',167),
              ('ios-marketing','1024x1024','1x',1024),
          ]

          images = []
          for idiom, size, scale, px in specs:
              filename = f'icon-{idiom}-{size.replace(".", "_")}-{scale}.png'
              base.resize((px, px), Image.Resampling.LANCZOS).convert('RGB').save(out / filename, 'PNG')
              images.append({'idiom': idiom, 'size': size, 'scale': scale, 'filename': filename})

          (out / 'Contents.json').write_text(json.dumps({'images': images, 'info': {'author':'xcode','version':1}}, indent=2))
          root = Path('ios/SynFlix/Assets.xcassets')
          (root / 'Contents.json').write_text(json.dumps({'info': {'author':'xcode','version':1}}, indent=2))
          PY

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned device app
        working-directory: ios
        run: |
          xcodebuild \
            -project SynFlix.xcodeproj \
            -scheme SynFlix \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build

      - name: Package sideloadable IPA
        working-directory: ios
        run: |
          APP='build/Build/Products/Release-iphoneos/SynFlix.app'
          test -d "$APP" || { echo 'SynFlix.app was not produced'; exit 1; }
          rm -rf Payload SynFlix.ipa
          mkdir Payload
          cp -R "$APP" Payload/SynFlix.app
          /usr/bin/zip -qry SynFlix.ipa Payload
          unzip -t SynFlix.ipa
          ls -lh SynFlix.ipa

      - name: Upload SynFlix IPA
        uses: actions/upload-artifact@v4
        with:
          name: SynFlix-iOS-IPA
          path: ios/SynFlix.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable IPA download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view ios-latest >/dev/null 2>&1; then
            gh release create ios-latest --title "SynFlix iOS" --notes "Rolling unsigned SynFlix IPA for sideloading with Sideloadly, AltStore, SideStore, or another signer." --target "${{ github.sha }}"
          fi
          gh release upload ios-latest ios/SynFlix.ipa --clobber
