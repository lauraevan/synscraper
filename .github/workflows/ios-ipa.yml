name: Build SynFlix iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - "frontend/public/synflix-logo.webp"
      - "frontend/src/App.js"
      - "frontend/src/ios-native.css"
      - "frontend/src/theme-system.css"
      - "frontend/src/lib/preferences.js"
      - ".github/workflows/ios-ipa.yml"

permissions:
  contents: write

jobs:
  ios-ipa:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build SynFlix brand assets
        run: |
          python -m pip install --disable-pip-version-check pillow
          python <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageOps

          src_path = Path("frontend/public/synflix-logo.webp")
          if not src_path.exists():
              raise SystemExit("frontend/public/synflix-logo.webp is missing")

          src = Image.open(src_path).convert("RGBA")
          bbox = src.getbbox()
          logo = src.crop(bbox) if bbox else src

          asset_root = Path("ios/SynFlix/Assets.xcassets")
          appicon_out = asset_root / "AppIcon.appiconset"
          logo_out = asset_root / "SynFlixLogo.imageset"
          appicon_out.mkdir(parents=True, exist_ok=True)
          logo_out.mkdir(parents=True, exist_ok=True)

          (asset_root / "Contents.json").write_text(
              json.dumps({"info": {"author": "xcode", "version": 1}}, indent=2)
          )

          # Native SwiftUI branding uses the same real SynFlix logo as the web client.
          native_images = []
          for scale, px in (("1x", 128), ("2x", 256), ("3x", 384)):
              fitted = ImageOps.contain(logo, (px, px), Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (px, px), (0, 0, 0, 0))
              canvas.alpha_composite(
                  fitted,
                  ((px - fitted.width) // 2, (px - fitted.height) // 2),
              )
              filename = f"synflix-logo-{scale}.png"
              canvas.save(logo_out / filename, "PNG")
              native_images.append({
                  "idiom": "universal",
                  "scale": scale,
                  "filename": filename,
              })

          (logo_out / "Contents.json").write_text(
              json.dumps({
                  "images": native_images,
                  "info": {"author": "xcode", "version": 1},
                  "properties": {"preserves-vector-representation": False},
              }, indent=2)
          )

          def branded_icon(canvas_size):
              canvas = Image.new("RGBA", (canvas_size, canvas_size), (7, 7, 6, 255))
              max_dim = max(1, int(canvas_size * 0.68))
              fitted = ImageOps.contain(
                  logo,
                  (max_dim, max_dim),
                  Image.Resampling.LANCZOS,
              )
              canvas.alpha_composite(
                  fitted,
                  ((canvas_size - fitted.width) // 2, (canvas_size - fitted.height) // 2),
              )
              return canvas

          specs = [
              ("iphone", "20x20", "2x", 40), ("iphone", "20x20", "3x", 60),
              ("iphone", "29x29", "2x", 58), ("iphone", "29x29", "3x", 87),
              ("iphone", "40x40", "2x", 80), ("iphone", "40x40", "3x", 120),
              ("iphone", "60x60", "2x", 120), ("iphone", "60x60", "3x", 180),
              ("ipad", "20x20", "1x", 20), ("ipad", "20x20", "2x", 40),
              ("ipad", "29x29", "1x", 29), ("ipad", "29x29", "2x", 58),
              ("ipad", "40x40", "1x", 40), ("ipad", "40x40", "2x", 80),
              ("ipad", "76x76", "1x", 76), ("ipad", "76x76", "2x", 152),
              ("ipad", "83.5x83.5", "2x", 167),
              ("ios-marketing", "1024x1024", "1x", 1024),
          ]

          master = branded_icon(1024)
          images = []
          for idiom, size, scale, px in specs:
              filename = f'icon-{idiom}-{size.replace(".", "_")}-{scale}.png'
              master.resize((px, px), Image.Resampling.LANCZOS).convert("RGB").save(
                  appicon_out / filename,
                  "PNG",
              )
              images.append({
                  "idiom": idiom,
                  "size": size,
                  "scale": scale,
                  "filename": filename,
              })

          (appicon_out / "Contents.json").write_text(
              json.dumps({
                  "images": images,
                  "info": {"author": "xcode", "version": 1},
              }, indent=2)
          )
          PY

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned device app
        working-directory: ios
        run: |
          xcodebuild \
            -project SynFlix.xcodeproj \
            -scheme SynFlix \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build

      - name: Package sideloadable IPA
        working-directory: ios
        run: |
          APP='build/Build/Products/Release-iphoneos/SynFlix.app'
          test -d "$APP" || { echo 'SynFlix.app was not produced'; exit 1; }
          rm -rf Payload SynFlix.ipa
          mkdir Payload
          cp -R "$APP" Payload/SynFlix.app
          /usr/bin/zip -qry SynFlix.ipa Payload
          unzip -t SynFlix.ipa
          ls -lh SynFlix.ipa

      - name: Upload SynFlix IPA
        uses: actions/upload-artifact@v4
        with:
          name: SynFlix-iOS-IPA
          path: ios/SynFlix.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable IPA download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view ios-latest >/dev/null 2>&1; then
            gh release create ios-latest --title "SynFlix iOS" --notes "Rolling unsigned SynFlix IPA for sideloading with Sideloadly, AltStore, SideStore, or another signer." --target "${{ github.sha }}"
          fi
          gh release upload ios-latest ios/SynFlix.ipa --clobber
