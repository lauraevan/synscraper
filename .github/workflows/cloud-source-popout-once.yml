name: One-time cloud source popout

on:
  push:
    branches: [main]
    paths:
      - ".github/cloud-source-popout-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch cloud source popout
        run: python .github/scripts/cloud_source_patch.py

      - name: Validate production build
        run: |
          python -m py_compile backend/server.py backend/scraper.py backend/providers/*.py
          cd frontend
          yarn install --frozen-lockfile
          yarn build

      - name: Commit cloud source popout
        run: |
          git config user.name "Synapse Bot"
          git config user.email "264532369+lauraevan@users.noreply.github.com"
          git add frontend/src/components/SynapsePlayer.jsx
          git commit -m "Make cloud button open source switcher"
          git push
