name: Frontend build check

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/frontend-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: yarn install
      - run: yarn build
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: ""
