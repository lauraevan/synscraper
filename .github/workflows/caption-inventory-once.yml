name: Caption source inventory once

on:
  push:
    paths:
      - '.github/workflows/caption-inventory-once.yml'

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements.txt
      - name: Inspect caption quality
        run: |
          python - <<'PY'
          import asyncio, json, re, sys
          import requests
          sys.path.insert(0, 'backend')
          import scraper

          TIMING = re.compile(r'(?m)^\s*(\d{1,2}:)?\d{2}:\d{2}[\.,]\d{3}\s*-->\s*(\d{1,2}:)?\d{2}:\d{2}[\.,]\d{3}')

          def ts(value):
              value = value.strip().replace(',', '.')
              parts = value.split(':')
              try:
                  nums = [float(x) for x in parts]
              except ValueError:
                  return None
              total = 0.0
              for n in nums:
                  total = total * 60 + n
              return total

          def metrics(text):
              text = text.replace('\r', '')
              blocks = re.split(r'\n{2,}', text)
              cues = []
              malformed = 0
              for block in blocks:
                  lines = block.split('\n')
                  timing = next((line for line in lines if '-->' in line), None)
                  if not timing:
                      continue
                  try:
                      left, right = timing.split('-->', 1)
                      start = ts(left)
                      end = ts(right.strip().split()[0])
                  except Exception:
                      start = end = None
                  if start is None or end is None or end <= start:
                      malformed += 1
                      continue
                  idx = lines.index(timing)
                  body = ' '.join(x.strip() for x in lines[idx + 1:] if x.strip())
                  body = re.sub(r'<[^>]+>', '', body).strip()
                  if body:
                      cues.append((start, end, body))
              dupes = max(0, len(cues) - len({x[2] for x in cues}))
              return {
                  'bytes': len(text.encode('utf-8', 'ignore')),
                  'cues': len(cues),
                  'malformed': malformed,
                  'duplicates': dupes,
                  'first_sec': round(cues[0][0], 2) if cues else None,
                  'last_sec': round(max(x[1] for x in cues), 2) if cues else None,
                  'avg_chars': round(sum(len(x[2]) for x in cues) / len(cues), 1) if cues else 0,
                  'has_webvtt_header': text.lstrip().startswith('WEBVTT'),
              }

          async def main():
              streams = await scraper.scrape_streams('movie', '1083381')
              seen = set()
              rows = []
              for stream in streams:
                  for cap in stream.get('captions') or []:
                      url = cap.get('url')
                      if not url or url in seen:
                          continue
                      seen.add(url)
                      headers = {'User-Agent': scraper.USER_AGENT, 'Accept': 'text/vtt,text/plain,*/*'}
                      if cap.get('referer'):
                          headers['Referer'] = cap['referer']
                      if cap.get('origin'):
                          headers['Origin'] = cap['origin']
                      row = {
                          'video_server': stream.get('name'),
                          'provider': stream.get('provider'),
                          'caption_name': cap.get('name'),
                          'caption_lang': cap.get('lang'),
                          'caption_source': cap.get('source'),
                      }
                      try:
                          r = requests.get(url, headers=headers, timeout=12)
                          row['http'] = r.status_code
                          row['content_type'] = r.headers.get('content-type', '')
                          if r.ok:
                              row.update(metrics(r.text))
                      except Exception as exc:
                          row['error'] = type(exc).__name__
                      rows.append(row)
              print('CAPTION_COUNT', len(rows))
              print(json.dumps(rows, indent=2, ensure_ascii=False))

          asyncio.run(main())
          PY
