name: Verify Orlando-first production bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-orlando-live.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check live asset manifest
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' \
            "https://synscraper-tffk.vercel.app/asset-manifest.json?probe=$(date +%s)" \
            -o /tmp/asset-manifest.json
          cat /tmp/asset-manifest.json
          python - <<'PY'
          import json
          manifest = json.load(open('/tmp/asset-manifest.json'))
          main = manifest['files']['main.js']
          print(f'LIVE_MAIN_JS={main}')
          if 'main.8ebbd4a2.js' not in main:
              raise SystemExit(f'Production is still serving the wrong bundle: {main}')
          open('/tmp/main-path', 'w').write(main)
          PY

      - name: Check live compiled player is Orlando then Miami
        run: |
          set -euo pipefail
          MAIN_PATH="$(cat /tmp/main-path)"
          curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' \
            "https://synscraper-tffk.vercel.app${MAIN_PATH}?probe=$(date +%s)" \
            -o /tmp/main.js
          python - <<'PY'
          text = open('/tmp/main.js', encoding='utf-8').read()
          checks = {
              'Orlando is first and Vidy/Miami second in provider queue': '["orlando","vidy","castle","vidlink"' in text,
              'Orlando is the startup provider': 'provider:"orlando",timeout:8e3' in text,
              'Miami is explicitly requested as the fallback mirror': 'provider:"vidy",mirror:"miami",timeout:5200' in text or 'provider:"vidy",mirror:"miami",timeout:5200' in text.replace('5.2e3', '5200'),
              'Orlando remains in source catalog': 'provider:"orlando",name:"Orlando"' in text,
          }
          for label, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ': ' + label)
          if not all(checks.values()):
              raise SystemExit('Live production bundle is not Orlando-first with Miami second')
          PY

      - name: Check live Orlando API
        run: |
          set -euo pipefail
          curl -fsSL --max-time 25 \
            'https://synscraper-tffk.vercel.app/api/streams?type=movie&id=1083381&provider=orlando&title=Backrooms&year=2026' \
            -o /tmp/orlando.json
          python - <<'PY'
          import json
          payload = json.load(open('/tmp/orlando.json'))
          servers = payload.get('servers') or []
          print('ORLANDO_SERVER_COUNT=', len(servers))
          print('QUALITIES=', [s.get('quality') for s in servers])
          if not servers or not all(s.get('provider') == 'orlando' for s in servers):
              raise SystemExit('Production Orlando API did not return Orlando servers')
          PY
