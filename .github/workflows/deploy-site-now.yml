name: Deploy SynScraper now

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    if: github.event.head_commit.message == 'Deploy SynScraper now'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize player-adjacent behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('frontend/src/components/SynapsePlayer.jsx')
          text = p.read_text()

          def one(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'missing patch target: {label}')
              text = text.replace(old, new, 1)

          # Keep the resolver-hints object stable so React hook linting passes in CI.
          if 'useCallback, useMemo' not in text:
              one(
                  'import { useEffect, useRef, useState, useCallback } from "react";',
                  'import { useEffect, useRef, useState, useCallback, useMemo } from "react";',
                  'useMemo import',
              )

          old_hints = '''    const streamResolveHints = {\n        title: meta?.title || meta?.name || "",\n        year: Number(String(meta?.release_date || meta?.first_air_date || "").slice(0, 4)) || undefined,\n        imdbId: meta?.imdb_id || meta?.external_ids?.imdb_id || undefined,\n    };'''
          new_hints = '''    const streamResolveHints = useMemo(() => ({\n        title: meta?.title || meta?.name || "",\n        year: Number(String(meta?.release_date || meta?.first_air_date || "").slice(0, 4)) || undefined,\n        imdbId: meta?.imdb_id || meta?.external_ids?.imdb_id || undefined,\n    }), [meta]);'''
          if old_hints in text:
              one(old_hints, new_hints, 'stable streamResolveHints')

          old_dep = '''    }, [mediaType, id, season, episode]);\n\n    // when ready + server chosen, start playback'''
          new_dep = '''    }, [mediaType, id, season, episode, streamResolveHints]);\n\n    // when ready + server chosen, start playback'''
          if old_dep in text:
              one(old_dep, new_dep, 'streamResolveHints effect dependency')

          # Orlando 4K badge and source priority.
          if 'return provider === "orlando" || provider === "vidcore"' not in text:
              one(
                  'return provider === "vidcore" || (provider === "vidy" && /miami/i.test(name));',
                  'return provider === "orlando" || provider === "vidcore" || (provider === "vidy" && /miami/i.test(name));',
                  'Orlando 4K badge',
              )

          old_catalog = '''const SOURCE_CATALOG = [\n    { provider: "vidy", name: "Miami" },\n    { provider: "orlando", name: "Orlando" },'''
          new_catalog = '''const SOURCE_CATALOG = [\n    { provider: "orlando", name: "Orlando" },\n    { provider: "vidy", name: "Miami" },'''
          if old_catalog in text:
              one(old_catalog, new_catalog, 'source catalog order')

          marker = 'const SOURCE_CATALOG = ['
          helper = '''const sourceQualityRank = (source) => {\n    const provider = String(source?.provider || "").trim().toLowerCase();\n    const name = String(source?.displayName || source?.name || "").trim().toLowerCase();\n    if (provider === "orlando") return 0;\n    if (provider === "vidy" && /miami/i.test(name)) return 1;\n    if (provider === "vidcore") return 2;\n    if (provider === "castle") return 3;\n    if (provider === "vidlink") return 4;\n    if (provider === "vidnest") return 5;\n    if (provider === "vidzee") return 6;\n    if (provider === "vidrock") return 7;\n    if (provider === "cinejoy") return 8;\n    if (provider === "vixsrc") return 9;\n    return 20;\n};\nconst bestServerForQuality = (items, height) => [...(items || [])]\n    .filter((source) => qualityHeight(source?.quality) === height)\n    .sort((a, b) => sourceQualityRank(a) - sourceQualityRank(b))[0] || null;\n\n'''
          if 'const sourceQualityRank = (source)' not in text:
              text = text.replace(marker, helper + marker, 1)

          old_quality = '''    const qualityChoices = QUALITY_LADDER.map((target) => {\n        const levelIndex = levels.findIndex((l) => Number(l.height || 0) === target.height);\n        const sameMirror = servers.find((s) => s.provider === activeServer?.provider && s.name === activeServer?.name && qualityHeight(s.quality) === target.height);\n        const sameProvider = servers.find((s) => s.provider === activeServer?.provider && qualityHeight(s.quality) === target.height);\n        const server = sameMirror || sameProvider || servers.find((s) => qualityHeight(s.quality) === target.height);\n        return { ...target, levelIndex, server, available: levelIndex >= 0 || !!server };\n    });'''
          new_quality = '''    const qualityChoices = QUALITY_LADDER.map((target) => {\n        const levelIndex = levels.findIndex((l) => Number(l.height || 0) === target.height);\n        const server = bestServerForQuality(servers, target.height);\n        return { ...target, levelIndex, server, available: levelIndex >= 0 || !!server };\n    });'''
          if old_quality in text:
              one(old_quality, new_quality, 'quality source ranking')

          old_choose = '''    const chooseQuality = (choice) => {\n        if (!choice?.available) return;\n        setPreferredQuality(choice.height);\n        preferredQualityRef.current = choice.height;\n        const sameMirror = servers.find((candidate) =>\n            candidate.provider === activeServer?.provider && candidate.name === activeServer?.name && qualityHeight(candidate.quality) === choice.height\n        );\n        if (sameMirror && sameMirror.id !== serverId) {\n            pendingSeekRef.current = videoRef.current?.currentTime || current || 0;\n            setLevel(-1);\n            setServerId(sameMirror.id);\n            setMenu(null);\n            return;\n        }\n        if (choice.levelIndex >= 0 && hlsRef.current) {\n            changeLevel(choice.levelIndex);\n            setMenu(null);\n            return;\n        }\n        if (choice.server) {\n            pendingSeekRef.current = videoRef.current?.currentTime || current || 0;\n            setLevel(-1);\n            setServerId(choice.server.id);\n        }\n        setMenu(null);\n    };'''
          new_choose = '''    const chooseQuality = (choice) => {\n        if (!choice?.available) return;\n        setPreferredQuality(choice.height);\n        preferredQualityRef.current = choice.height;\n\n        const targetServer = choice.server;\n        const currentIsAtLeastAsPreferred = choice.levelIndex >= 0\n            && activeServer\n            && (!targetServer || sourceQualityRank(activeServer) <= sourceQualityRank(targetServer));\n\n        if (currentIsAtLeastAsPreferred && hlsRef.current) {\n            changeLevel(choice.levelIndex);\n            setMenu(null);\n            return;\n        }\n        if (targetServer && targetServer.id !== serverId) {\n            pendingSeekRef.current = videoRef.current?.currentTime || current || 0;\n            setLevel(-1);\n            setServerId(targetServer.id);\n            setMenu(null);\n            return;\n        }\n        if (choice.levelIndex >= 0 && hlsRef.current) {\n            changeLevel(choice.levelIndex);\n        }\n        setMenu(null);\n    };'''
          if old_choose in text:
              one(old_choose, new_choose, 'silent quality routing')

          text = text.replace(
              '{choice.levelIndex >= 0 ? "HLS" : choice.server?.name || "Stream"}',
              '{choice.available ? "Available" : "Unavailable"}',
              1,
          )
          text = text.replace(
              '{choice.available ? (choice.levelIndex >= 0 ? "HLS" : choice.server?.name || "Stream") : "Unavailable"}',
              '{choice.available ? "Available" : "Unavailable"}',
              1,
          )
          text = text.replace(
              'Miami is prioritized for startup. Switching sources keeps your current position.',
              'Orlando is prioritized for startup, with Miami immediately behind it. Switching sources keeps your current position.',
          )
          text = text.replace(
              '// Progressive source loading: start Miami immediately, fill the rest in the background.',
              '// Progressive source loading: start Orlando immediately, keep Miami directly behind it, then fill the rest in the background.',
          )

          p.write_text(text)

          checks = {
              'stable resolver hints': 'useMemo(() => ({' in text and 'streamResolveHints]);' in text,
              'Orlando 4K badge': 'provider === "orlando" || provider === "vidcore"' in text,
              'Orlando first': 'const SOURCE_CATALOG = [\n    { provider: "orlando", name: "Orlando" },\n    { provider: "vidy", name: "Miami" },' in text,
              'quality routing': 'const bestServerForQuality' in text,
              'source blind labels': 'choice.server?.name || "Stream"' not in text,
          }
          for label, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ': ' + label)
          if not all(checks.values()):
              raise SystemExit('final player verification failed')
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm install -g yarn@1.22.22
          yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: CI=false yarn build

      - name: Sync production bundle
        run: |
          rm -rf public backend/public
          cp -R frontend/build public
          cp -R frontend/build backend/public

      - name: Verify production bundle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('public/asset-manifest.json').read_text())
          main_path = 'public/' + manifest['files']['main.js'].lstrip('/')
          js = Path(main_path).read_text(errors='ignore')
          checks = {
              'site rework': 'Find your next watch.' in js,
              'Orlando source': 'Orlando' in js,
              '4K badge': '4K' in js,
              'quality labels': 'Available' in js,
          }
          print('MAIN_JS=' + main_path)
          for label, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ': ' + label)
          if not all(checks.values()):
              raise SystemExit('compiled bundle verification failed')
          PY

      - name: Commit production build
        run: |
          git config user.name "Polaris"
          git config user.email "264532369+lauraevan@users.noreply.github.com"
          git rm -f .github/workflows/deploy-site-now.yml .github/deploy-now-trigger.txt 2>/dev/null || true
          git add frontend/src/components/SynapsePlayer.jsx public backend/public
          git diff --cached --quiet && exit 0
          git commit -m "Deploy polished SynScraper site"
          git push
