name: One-time VTT Granite subtitles

on:
  push:
    branches: [main]
    paths:
      - ".github/vtt-granite-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch VTT and Granite subtitles
        run: python .github/scripts/add_vtt_granite.py

      - name: Validate backend and frontend
        run: |
          python -m py_compile backend/server.py backend/scraper.py backend/providers/*.py
          cd frontend
          yarn install --frozen-lockfile
          CI=false yarn build

      - name: Commit VTT Granite subtitle support
        run: |
          git config user.name "Synapse Bot"
          git config user.email "264532369+lauraevan@users.noreply.github.com"
          git add backend/scraper.py backend/server.py frontend/src/components/SynapsePlayer.jsx
          git commit -m "Add WebVTT and Granite subtitle support"
          git push
