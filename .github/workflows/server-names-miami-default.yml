name: Apply clean server names and Miami default

on:
  push:
    paths:
      - '.github/workflows/server-names-miami-default.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch backend and frontend
        run: |
          python - <<'PY'
          from pathlib import Path

          # Backend: clean mirror names + Miami-first ranking.
          path = Path('backend/scraper.py')
          text = path.read_text()
          old = '''            if subserver:\n                if pid == "vidzee":\n                    pretty = {\n                        "dcloud": "DCloud",\n                        "tik": "Tik",\n                        "ipcloud": "IPCloud",\n                        "v6:hindi": "V6 Hindi",\n                    }.get(subserver.lower(), subserver)\n                    display_name = f"{name} · {pretty}"\n                elif subserver.lower().startswith(name.lower()):\n                    display_name = subserver\n                else:\n                    display_name = f"{name} · {subserver}"\n            else:\n                display_name = name if idx == 0 else f"{name} {idx + 1}"\n'''
          new = '''            if subserver:\n                if pid == "vidzee":\n                    display_name = {\n                        "dcloud": "DCloud",\n                        "tik": "Tik",\n                        "ipcloud": "IPCloud",\n                        "v6:hindi": "V6 Hindi",\n                    }.get(subserver.lower(), subserver)\n                else:\n                    display_name = subserver\n                    if display_name.lower().startswith(name.lower()):\n                        display_name = display_name[len(name):].lstrip(" ·:-")\n                    display_name = display_name or name\n            else:\n                display_name = name if idx == 0 else f"{name} {idx + 1}"\n'''
          if old not in text:
              raise SystemExit('backend naming block not found')
          text = text.replace(old, new, 1)

          old_sort = '''    # rank: primary first, then hls before mp4\n    servers.sort(key=lambda s: (0 if s["primary"] else 1, 0 if s["type"] == "hls" else 1))\n'''
          new_sort = '''    # Miami is the default playback source. Prefer its 1080p stream for fast startup,\n    # then lower-bitrate Miami fallbacks; 4K remains selectable manually.\n    def _server_rank(server):\n        if server.get("provider") == "vidy" and str(server.get("name") or "").lower() == "miami":\n            quality = str(server.get("quality") or "").lower()\n            qrank = 0 if "1080" in quality else 1 if "720" in quality else 2 if "480" in quality else 3 if ("2160" in quality or "4k" in quality) else 4\n            return (0, qrank, 0 if server.get("type") == "hls" else 1)\n        return (1 if server.get("primary") else 2, 0, 0 if server.get("type") == "hls" else 1)\n\n    servers.sort(key=_server_rank)\n'''
          if old_sort not in text:
              raise SystemExit('backend sort block not found')
          path.write_text(text.replace(old_sort, new_sort, 1))

          # Remove old Synapse Player API branding.
          path = Path('backend/server.py')
          text = path.read_text()
          text = text.replace('FastAPI(title="Synapse Player API")', 'FastAPI(title="SynScraper API")')
          text = text.replace('logging.getLogger("synapse-player")', 'logging.getLogger("synscraper")')
          text = text.replace('"message": "Synapse Player API"', '"message": "SynScraper API"')
          path.write_text(text)

          # Frontend: Miami first, clean mirror presentation, remove player branding.
          path = Path('frontend/src/components/SynapsePlayer.jsx')
          text = path.read_text()

          old_catalog = '''const SOURCE_CATALOG = [\n    { provider: "castle", name: "Orbit" },\n    { provider: "vidlink", name: "Nova" },\n    { provider: "vidnest", name: "Nest" },\n    { provider: "vidzee", name: "Zen" },\n    { provider: "vidrock", name: "Rock" },\n    { provider: "vidy", name: "Vidy" },\n    { provider: "cinejoy", name: "CineJoy" },\n    { provider: "vixsrc", name: "Vix" },\n];'''
          new_catalog = '''const SOURCE_CATALOG = [\n    { provider: "vidy", name: "Miami" },\n    { provider: "castle", name: "Orbit" },\n    { provider: "vidlink", name: "Nova" },\n    { provider: "vidnest", name: "Nest" },\n    { provider: "vidzee", name: "Zen" },\n    { provider: "vidrock", name: "Rock" },\n    { provider: "cinejoy", name: "Lisbon" },\n    { provider: "vixsrc", name: "Vix" },\n];'''
          if old_catalog not in text:
              raise SystemExit('source catalog block not found')
          text = text.replace(old_catalog, new_catalog, 1)

          old_default = '''                if (list.length) {\n                    setServerId(list[0].id);\n                    setMode("ready");\n'''
          new_default = '''                if (list.length) {\n                    const preferred = list.find((s) => s.provider === "vidy" && /miami/i.test(String(s.name || "")) && qualityHeight(s.quality) === 1080)\n                        || list.find((s) => s.provider === "vidy" && /miami/i.test(String(s.name || "")))\n                        || list[0];\n                    setServerId(preferred.id);\n                    setMode("ready");\n'''
          if old_default not in text:
              raise SystemExit('default source block not found')
          text = text.replace(old_default, new_default, 1)

          # Hide provider-brand placeholders for mirror-based sources if unavailable.
          old_missing = '''        if (!matches.length) {\n            return [{ id: `unavailable-${source.provider}`, provider: source.provider, name: source.name, displayName: source.name, available: false }];\n        }'''
          new_missing = '''        if (!matches.length) {\n            if (source.provider === "vidy" || source.provider === "cinejoy") return [];\n            return [{ id: `unavailable-${source.provider}`, provider: source.provider, name: source.name, displayName: source.name, available: false }];\n        }'''
          if old_missing not in text:
              raise SystemExit('missing source block not found')
          text = text.replace(old_missing, new_missing, 1)

          text = text.replace('    const [brandExpanded, setBrandExpanded] = useState(false);\n', '')
          text = text.replace('                        <p className="text-[11px] font-medium uppercase tracking-[0.24em] text-white/35">Synapse Player</p>\n', '')
          text = text.replace('This source exposes no caption track. Pick another source above; Synapse keeps your movie position while it switches.', 'This source exposes no caption track. Pick another source above; your movie position is kept while it switches.')
          text = text.replace('                                                    <span>{s.name}</span><span className="text-[10px] opacity-45">{s.provider}</span>\n', '                                                    <span>{s.name}</span>\n')

          brand_start = '''                        <button\n                            data-testid="synplayer-brand-pill"'''
          if brand_start not in text:
              raise SystemExit('SynPlayer brand pill not found')
          start = text.index(brand_start)
          end_marker = '''                        </button>\n                    </div>'''
          end = text.index(end_marker, start)
          text = text[:start] + '                    </div>' + text[end + len(end_marker):]

          if 'Synapse Player' in text or 'synplayer-brand-pill' in text or 'brandExpanded' in text:
              raise SystemExit('visible player branding still present')
          path.write_text(text)
          PY

      - name: Validate backend
        run: |
          python -m py_compile backend/scraper.py backend/server.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'backend')
          import scraper
          sample = [
              {'provider':'vidy','name':'Miami','quality':'2160p','type':'hls','primary':False},
              {'provider':'castle','name':'Orbit','quality':'Auto','type':'hls','primary':True},
              {'provider':'vidy','name':'Miami','quality':'1080p','type':'hls','primary':False},
          ]
          # Validate the intended order using the same semantics from the file text.
          src = open('backend/scraper.py').read()
          assert 'display_name = display_name[len(name):].lstrip(" ·:-")' in src
          assert '"1080" in quality' in src
          assert 'Synapse Player API' not in open('backend/server.py').read()
          PY

      - name: Build frontend
        run: |
          yarn --cwd frontend install
          CI=false GENERATE_SOURCEMAP=false yarn --cwd frontend build
          rm -rf public backend/public
          cp -R frontend/build public
          cp -R frontend/build backend/public

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/scraper.py backend/server.py frontend/src/components/SynapsePlayer.jsx public backend/public
          git commit -m "Use clean server names and make Miami default"
          git push
