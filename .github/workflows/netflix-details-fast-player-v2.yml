name: Apply Netflix details and faster player v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Run Netflix details and fast player v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply source changes
        run: python .github/scripts/apply_netflix_details_fast_player.py

      - name: Install frontend
        run: yarn --cwd frontend install --frozen-lockfile

      - name: Build frontend
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
        run: yarn --cwd frontend build

      - name: Sync deploy bundles
        shell: bash
        run: |
          rm -rf public backend/public
          cp -R frontend/build public
          mkdir -p backend
          cp -R frontend/build backend/public

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/Hero.jsx frontend/src/components/DetailsTrailerBackground.jsx frontend/src/components/TrailerPreview.jsx frontend/src/pages/Title.jsx frontend/src/components/SynapsePlayer.jsx public backend/public
          git commit -m "Polish Netflix-style previews and speed up SynPlayer"
          git push origin HEAD:main
