name: One-time player polish

on:
  push:
    branches: [main]
    paths:
      - ".github/player-polish-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Polish seeking, quality state, and Vix HLS
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing patch target: {label}")
              return text.replace(old, new, 1)

          p = Path("frontend/src/components/SynapsePlayer.jsx")
          t = p.read_text()

          t = rep(
              t,
              '        if (next) { setServerId(next.id); playServer(next); }\n',
              '        if (next) {\n            pendingSeekRef.current = videoRef.current?.currentTime || 0;\n            setServerId(next.id);\n        }\n',
              "failover single load",
          )

          t = rep(
              t,
              '        setMenu(null); setServerId(s.id); playServer(s);\n',
              '        setMenu(null); setServerId(s.id);\n',
              "server single load",
          )
          t = rep(
              t,
              '        setServerId(s.id);\n        playServer(s);\n    };\n\n    // video wiring',
              '        setServerId(s.id);\n    };\n\n    // video wiring',
              "caption source single load",
          )
          t = rep(
              t,
              '            setServerId(choice.server.id);\n            playServer(choice.server);\n',
              '            setServerId(choice.server.id);\n',
              "quality source single load",
          )

          t = rep(
              t,
              '    const activeQualityHeight = level >= 0 ? Number(levels[level]?.height || 0) : qualityHeight(activeServer?.quality);\n',
              '    const activeQualityHeight = level >= 0 ? Number(levels[level]?.height || 0) : (levels.length ? 0 : qualityHeight(activeServer?.quality));\n    const autoServer = servers.find((s) => s.provider === activeServer?.provider && /^auto$/i.test(String(s.quality || "")))\n        || servers.find((s) => /^auto$/i.test(String(s.quality || "")));\n    const autoQualityAvailable = levels.length > 0 || !!autoServer;\n',
              "quality active state",
          )

          t = rep(
              t,
              '    const changeLevel = (i) => { if (hlsRef.current) { hlsRef.current.currentLevel = i; } setLevel(i); setMenu(null); };\n    const chooseQuality = (choice) => {',
              '    const changeLevel = (i) => { if (hlsRef.current) { hlsRef.current.currentLevel = i; } setLevel(i); setMenu(null); };\n    const chooseAutoQuality = () => {\n        if (hlsRef.current && levels.length) {\n            changeLevel(-1);\n            return;\n        }\n        if (autoServer && autoServer.id !== serverId) {\n            pendingSeekRef.current = videoRef.current?.currentTime || current || 0;\n            setLevel(-1);\n            setMenu(null);\n            setServerId(autoServer.id);\n            return;\n        }\n        setMenu(null);\n    };\n    const chooseQuality = (choice) => {',
              "auto quality handler",
          )

          t = rep(
              t,
              '                                <div className="absolute inset-y-0 left-0 bg-white" style={{ width: `${pct}%` }} />\n',
              '                                <div className="absolute inset-y-0 left-0 bg-white" style={{ width: `${seekPct}%` }} />\n',
              "live scrub fill",
          )

          t = rep(
              t,
              '<MenuItem active={level === -1} onClick={() => changeLevel(-1)} testId="quality-auto">Auto <span className="text-xs opacity-60">Adaptive</span></MenuItem>',
              '<MenuItem active={level === -1 && activeQualityHeight === 0} disabled={!autoQualityAvailable} onClick={chooseAutoQuality} testId="quality-auto">Auto <span className="text-xs opacity-60">Adaptive</span></MenuItem>',
              "auto quality UI",
          )
          p.write_text(t)

          v = Path("backend/providers/vixsrc.py")
          s = v.read_text()
          s = rep(
              s,
              "        quality = f\"{best_res}p\" if best_res > 0 else \"Auto\"\n",
              "        quality = \"Auto\"\n        playback_url = master_url\n",
              "vix quality",
          )
          s = rep(
              s,
              "                    'url': best_url,\n                    'quality': quality,\n",
              "                    'url': playback_url,\n                    'quality': quality,\n                    'type': 'hls',\n",
              "vix master url",
          )
          s = rep(
              s,
              '        self.log(f"Stream URL: {best_url[:100]}...")\n',
              '        self.log(f"Stream URL: {playback_url[:100]}...")\n',
              "vix log",
          )
          v.write_text(s)
          PY

      - name: Validate frontend and backend
        run: |
          python -m py_compile backend/server.py backend/scraper.py backend/providers/*.py
          cd frontend
          yarn install --frozen-lockfile
          yarn build

      - name: Commit polish
        run: |
          git config user.name "Synapse Bot"
          git config user.email "264532369+lauraevan@users.noreply.github.com"
          git add frontend/src/components/SynapsePlayer.jsx backend/providers/vixsrc.py
          git commit -m "Polish quality selection and instant scrubbing"
          git push
