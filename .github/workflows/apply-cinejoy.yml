name: Wire CineJoy provider

on:
  push:
    paths:
      - '.github/workflows/apply-cinejoy.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate provider and sync Vidy
        shell: bash
        run: |
          cp synflix_scrapers/vidy.py backend/providers/vidy.py
          python - <<'PY'
          from pathlib import Path

          scraper = Path('backend/scraper.py')
          text = scraper.read_text()
          if 'from providers.cinejoy import CineJoyResolver' not in text:
              text = text.replace(
                  'from providers.vidy import VidyResolver\n',
                  'from providers.vidy import VidyResolver\nfrom providers.cinejoy import CineJoyResolver\n'
              )
          if '("CineJoy", "cinejoy", CineJoyResolver)' not in text:
              text = text.replace(
                  '    ("Vidy", "vidy", VidyResolver),\n',
                  '    ("Vidy", "vidy", VidyResolver),\n    ("CineJoy", "cinejoy", CineJoyResolver),\n'
              )
          scraper.write_text(text)

          player = Path('frontend/src/components/SynapsePlayer.jsx')
          text = player.read_text()
          marker = '    { provider: "cinejoy", name: "CineJoy" },'
          if marker not in text:
              text = text.replace(
                  '    { provider: "vidy", name: "Vidy" },\n    { provider: "vixsrc", name: "Vix" },',
                  '    { provider: "vidy", name: "Vidy" },\n    { provider: "cinejoy", name: "CineJoy" },\n    { provider: "vixsrc", name: "Vix" },'
              )
          player.write_text(text)

          bundle = Path('public/static/js/main.53686aec.js')
          if bundle.exists():
              text = bundle.read_text()
              marker = '{provider:"cinejoy",name:"CineJoy"}'
              if marker not in text:
                  text = text.replace(
                      '{provider:"vidy",name:"Vidy"},{provider:"vixsrc",name:"Vix"}',
                      '{provider:"vidy",name:"Vidy"},{provider:"cinejoy",name:"CineJoy"},{provider:"vixsrc",name:"Vix"}'
                  )
              bundle.write_text(text)

          for req_name in ('requirements.txt', 'backend/requirements.txt'):
              req = Path(req_name)
              lines = req.read_text().splitlines()
              if not any(line.startswith('wasmtime==') for line in lines):
                  lines.append('wasmtime==48.0.0')
              req.write_text('\n'.join(lines) + '\n')
          PY
      - name: Syntax check
        run: python -m py_compile backend/providers/cinejoy.py backend/providers/vidy.py backend/scraper.py
      - name: Install backend dependencies
        run: python -m pip install -q -r requirements.txt
      - name: Live-test CineJoy resolver
        shell: bash
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, 'backend')
          from providers.cinejoy import CineJoyResolver
          tests = {
              'movie': ('550', 'movie', None, None),
              'tv': ('1399', 'tv', 1, 1),
          }
          report = {}
          for name, (mid, typ, season, episode) in tests.items():
              data = json.loads(CineJoyResolver().resolve(mid, media_type=typ, season=season, episode=episode))
              report[name] = {
                  'status': data.get('status'),
                  'playable_count': len(data.get('playable_urls') or []),
                  'subtitle_count': len(data.get('subtitles') or []),
                  'servers': [x.get('server') for x in (data.get('playable_urls') or [])],
                  'message': data.get('message'),
              }
          print(json.dumps(report, indent=2))
          if any(item['status'] != 'success' or item['playable_count'] < 1 for item in report.values()):
              raise SystemExit('CineJoy live integration test failed')
          PY
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/providers/vidy.py backend/scraper.py frontend/src/components/SynapsePlayer.jsx public/static/js/main.53686aec.js requirements.txt backend/requirements.txt
          if git diff --cached --quiet; then
            echo "Integration already applied"
            exit 0
          fi
          git commit -m "Integrate CineJoy provider and sync Vidy backend"
          git push
