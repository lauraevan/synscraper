name: Fix CineJoy exact mirror count

on:
  push:
    paths:
      - '.github/workflows/fix-cinejoy-mirror-count.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Count successful CineJoy mirrors, not stream rows
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/providers/cinejoy.py')
          s = p.read_text()
          old = '''        all_playable, all_subtitles, errors = [], [], {}\n        for server in servers[:6]:\n'''
          new = '''        all_playable, all_subtitles, errors = [], [], {}\n        successful_mirrors = 0\n        for server in servers[:6]:\n'''
          if new not in s:
              if old not in s: raise SystemExit('mirror counter insertion point missing')
              s = s.replace(old, new, 1)
          old2 = '''                if playable:\n                    all_playable.extend(playable); all_subtitles.extend(subtitles)\n                    if len(all_playable) >= 3: break\n'''
          new2 = '''                if playable:\n                    all_playable.extend(playable); all_subtitles.extend(subtitles)\n                    successful_mirrors += 1\n                    if successful_mirrors >= 3: break\n'''
          if new2 not in s:
              if old2 not in s: raise SystemExit('old stream-count break missing')
              s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - run: python -m pip install -q -r requirements.txt
      - name: Live verify 3 CineJoy mirrors + 1080p
        run: |
          python -m py_compile backend/providers/cinejoy.py
          python - <<'PY'
          import json, sys
          sys.path.insert(0, 'backend')
          from providers.cinejoy import CineJoyResolver
          data = json.loads(CineJoyResolver().resolve('550', media_type='movie'))
          mirrors = sorted(set(str(x.get('server')) for x in data.get('playable_urls', [])))
          qualities = [str(x.get('quality')) for x in data.get('playable_urls', [])]
          print(json.dumps({'status': data.get('status'), 'mirrors': mirrors, 'qualities': qualities}, indent=2))
          if data.get('status') != 'success': raise SystemExit('CineJoy failed')
          if len(mirrors) < 3: raise SystemExit('Need at least 3 exact CineJoy mirrors')
          if not any('1080' in q for q in qualities): raise SystemExit('CineJoy 1080p missing')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/providers/cinejoy.py
          git commit -m 'Expose three exact CineJoy mirrors'
          git push
