name: Diagnose Vidy live player

on:
  push:
    paths:
      - '.github/workflows/diagnose-vidy.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture live Vidy app
        shell: bash
        run: |
          mkdir -p vidy-diagnostic
          python - <<'PY'
          import html, json, re, urllib.request
          from pathlib import Path
          from urllib.parse import urljoin

          out = Path('vidy-diagnostic')
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36'
          base_headers = {
              'User-Agent': UA,
              'Accept': '*/*',
              'Accept-Language': 'en-US,en;q=0.9',
          }

          def get(url, referer=None):
              h = dict(base_headers)
              if referer:
                  h['Referer'] = referer
              req = urllib.request.Request(url, headers=h)
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read()
                  text = raw.decode('utf-8', 'ignore')
                  return r.geturl(), r.status, dict(r.headers.items()), text

          page = 'https://www.vidy.st/movie/550'
          final, status, headers, body = get(page)
          (out/'page.html').write_text(body, encoding='utf-8')

          scripts = [urljoin(final, html.unescape(s)) for s in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', body, re.I)]
          scripts = list(dict.fromkeys(scripts))

          # Vidy currently exposes runtime configuration separately.
          captures = []
          for url in ['https://www.vidy.st/config.js', *scripts]:
              try:
                  u, st, hs, text = get(url, final)
              except Exception as e:
                  captures.append({'url': url, 'error': repr(e)})
                  continue
              name = 'config.js' if url.endswith('/config.js') else f'script-{len(captures)}.js'
              (out/name).write_text(text, encoding='utf-8')
              captures.append({'url': u, 'status': st, 'content_type': hs.get('Content-Type',''), 'file': name, 'bytes': len(text)})

          summary = {'page': final, 'page_status': status, 'scripts': scripts, 'captures': captures, 'interesting': []}
          needles = ['api', 'fetch(', 'axios', 'tmdb', 'movie', 'episode', 'source', 'stream', 'provider', 'server', 'embed', 'decrypt', 'token', 'm3u8', 'mpd']
          for cap in captures:
              name = cap.get('file')
              if not name:
                  continue
              text = (out/name).read_text(encoding='utf-8', errors='ignore')
              low = text.lower()
              for needle in needles:
                  start = 0
                  while True:
                      pos = low.find(needle.lower(), start)
                      if pos < 0:
                          break
                      summary['interesting'].append({
                          'file': name,
                          'needle': needle,
                          'snippet': text[max(0,pos-500):min(len(text),pos+1200)]
                      })
                      start = pos + len(needle)
                      if sum(1 for x in summary['interesting'] if x['file']==name and x['needle']==needle) >= 12:
                          break

              # Pull absolute and root-relative endpoint-looking strings.
              endpoints = sorted(set(re.findall(r'https?://[^"\'`\\\s<>]+|/[A-Za-z0-9_.~!$&()*+,;=:@%/?#\-]{3,}', text)))
              summary.setdefault('endpoints', {})[name] = [e for e in endpoints if any(k in e.lower() for k in ('api','movie','tv','anime','source','stream','embed','server','token','provider'))][:500]

          (out/'summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          PY
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: vidy-diagnostic
          path: vidy-diagnostic/
          retention-days: 1
