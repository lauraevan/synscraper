name: Diagnose Vidy live player

on:
  push:
    paths:
      - '.github/workflows/diagnose-vidy.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run sanitized Vidy integration checks
        shell: bash
        run: |
          mkdir -p vidy-diagnostic
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          tests = {
              "movie": ["python", "synflix_scrapers/vidy.py", "550", "--type", "movie"],
              "tv": ["python", "synflix_scrapers/vidy.py", "1399", "--type", "tv", "--season", "1", "--episode", "1"],
              "anime": ["python", "synflix_scrapers/vidy.py", "16498", "--type", "anime", "--episode", "1"],
          }

          report = {}
          for name, command in tests.items():
              proc = subprocess.run(command, capture_output=True, text=True, timeout=150)
              item = {"exit_code": proc.returncode}
              try:
                  data = json.loads(proc.stdout)
                  item.update({
                      "status": data.get("status"),
                      "playable_count": len(data.get("playable_urls") or []),
                      "subtitle_count": len(data.get("subtitles") or []),
                      "message": data.get("message"),
                  })
              except Exception as exc:
                  item.update({"status": "parse_error", "message": str(exc), "stderr": proc.stderr[-500:]})
              report[name] = item

          Path("vidy-diagnostic/result.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY
      - name: Upload sanitized diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: vidy-diagnostic
          path: vidy-diagnostic/result.json
          retention-days: 1
