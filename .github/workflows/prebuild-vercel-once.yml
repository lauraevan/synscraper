name: Sync Vercel public bundle

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/vercel-prebuild-trigger'

permissions:
  contents: write

jobs:
  prebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Yarn
        run: npm install -g yarn@1.22.22
      - name: Install frontend
        run: yarn --cwd frontend install --frozen-lockfile
      - name: Build current frontend
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
        run: yarn --cwd frontend build
      - name: Commit production bundle
        run: |
          rm -rf public backend/public
          cp -R frontend/build public
          cp -R frontend/build backend/public
          python - <<'PY'
          import json
          from pathlib import Path
          package = Path('package.json')
          data = json.loads(package.read_text())
          data.setdefault('scripts', {})['build'] = 'test -f public/index.html'
          package.write_text(json.dumps(data, indent=2) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public backend/public package.json
          if git diff --cached --quiet; then
            echo "Production bundle already current"
            exit 0
          fi
          git commit -m "Sync current frontend for Vercel"
          git pull --rebase origin main
          git push origin HEAD:main
