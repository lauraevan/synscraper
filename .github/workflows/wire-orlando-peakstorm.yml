name: Wire Orlando Peakstorm resolver

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-orlando-peakstorm.yml'
      - 'backend/providers/orlando.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire Orlando resolver
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/scraper.py')
          text = path.read_text()

          text = text.replace(
              '("Orlando", "orlando", ("providers.vidy", "VidyResolver")),',
              '("Orlando", "orlando", ("providers.orlando", "OrlandoResolver")),',
          )

          old_marker = '        if provider_id in {"vidy", "orlando"}:'
          new_marker = '        if provider_id == "vidy":'
          if old_marker in text:
              start = text.index(old_marker)
              end = text.index('        out = r.resolve', start)
              block = (
                  '        if provider_id == "vidy":\n'
                  '            if provider_hint:\n'
                  '                resolve_kwargs["provider"] = provider_hint\n'
                  '            elif fast_mirrors:\n'
                  '                resolve_kwargs["provider"] = "fast"\n'
                  '            if metadata_hint:\n'
                  '                resolve_kwargs["metadata_hint"] = metadata_hint\n'
                  '        elif provider_id == "orlando" and metadata_hint:\n'
                  '            resolve_kwargs["metadata_hint"] = metadata_hint\n'
              )
              text = text[:start] + block + text[end:]
          elif new_marker not in text:
              raise SystemExit('Could not locate Orlando/Vidy resolver kwargs block')

          old_timeout = '            per_provider_timeout = 8.5 if provider_id else 9.0'
          new_timeout = '            per_provider_timeout = 14.0 if pid == "orlando" else (8.5 if provider_id else 9.0)'
          if old_timeout in text:
              text = text.replace(old_timeout, new_timeout)
          elif new_timeout not in text:
              raise SystemExit('Could not locate provider timeout line')

          path.write_text(text)
          PY

      - name: Syntax check
        run: python -m py_compile backend/scraper.py backend/providers/orlando.py

      - name: Commit wiring
        run: |
          if git diff --quiet; then
            echo "Orlando wiring already applied"
            exit 0
          fi
          git config user.name "Polaris"
          git config user.email "264532369+lauraevan@users.noreply.github.com"
          git add backend/scraper.py
          git commit -m "Use dedicated Orlando Peakstorm resolver"
          git push
