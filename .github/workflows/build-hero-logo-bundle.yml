name: Build TMDB hero logo bundle

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'Build TMDB hero logo bundle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend
        run: yarn --cwd frontend install

      - name: Build frontend
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
        run: yarn --cwd frontend build

      - name: Sync deploy bundles
        shell: bash
        run: |
          rm -rf public backend/public
          cp -R frontend/build public
          mkdir -p backend
          cp -R frontend/build backend/public

      - name: Commit bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public backend/public
          git commit -m "Build SynFlix TMDB hero logos"
          git push origin HEAD:main
