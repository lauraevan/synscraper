name: One-time Zen subserver expansion

on:
  push:
    paths:
      - '.github/zen-sources-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Zen subservers
        run: python .github/scripts/expand_zen_sources.py
      - name: Validate backend
        run: python -m py_compile backend/server.py backend/scraper.py backend/providers/*.py
      - name: Validate frontend
        run: |
          cd frontend
          yarn install --frozen-lockfile
          yarn build
      - name: Commit patch
        run: |
          git config user.name "Polaris"
          git config user.email "264532369+lauraevan@users.noreply.github.com"
          git add backend/scraper.py frontend/src/components/SynapsePlayer.jsx
          git commit -m "Expose VidZee Zen subservers in SynPlayer"
          git push
