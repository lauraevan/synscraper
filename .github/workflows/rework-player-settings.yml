name: Rework player settings

on:
  push:
    paths:
      - '.github/workflows/rework-player-settings.yml'
      - '.github/scripts/rework_player_settings.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply settings redesign
        run: python .github/scripts/rework_player_settings.py
      - name: Build frontend
        run: |
          yarn --cwd frontend install
          CI=false GENERATE_SOURCEMAP=false yarn --cwd frontend build
          rm -rf public
          cp -R frontend/build public
      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/SynapsePlayer.jsx public
          git commit -m "Redesign movie player settings"
          git push

# trigger: 1
