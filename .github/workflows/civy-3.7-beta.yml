name: Civy 3.7 Beta — Screenshot Reference UI
on:
  push:
    branches: [civy-37-reference-beta]
    paths:
      - 'ios/civy37/**'
      - '.github/workflows/civy-3.7-beta.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Reconstruct Civy and apply reference UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, pathlib
          source=pathlib.Path('ios/synflix-project.txt')
          pathlib.Path('ios/base.zip').write_bytes(base64.b64decode(source.read_text()))
          PY
          mkdir -p ios/build-src
          unzip -oq ios/base.zip -d ios/build-src
          cp ios/civy33/RootView.swift ios/build-src/Civy/RootView.swift
          python3 ios/civy34/apply.py ios/build-src
          python3 ios/civy36/apply.py ios/build-src
          (cd ios/build-src && patch --batch -p1 < ../civy37/root.patch)
          python3 ios/civy36/beta_brand.py ios/build-src
          cp ios/civy37/SearchView.swift ios/build-src/Civy/SearchView.swift
          cp ios/civy37/CivyReels.swift ios/build-src/Civy/CivyReels.swift
          cp ios/civy37/CivyLive.swift ios/build-src/Civy/CivyLive.swift
          python3 ios/civy37/project.py ios/build-src
          grep -q 'case live = "Live"' ios/build-src/Civy/RootView.swift || grep -q 'live = "Live"' ios/build-src/Civy/RootView.swift
          grep -q 'CFBundleDisplayName = "Civy Beta"' ios/build-src/Civy.xcodeproj/project.pbxproj
          grep -q 'MARKETING_VERSION = "3.7.0"' ios/build-src/Civy.xcodeproj/project.pbxproj
      - name: Parse and compile for iPhone
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun swiftc -frontend -parse ios/build-src/Civy/*.swift
          xcodebuild -project ios/build-src/Civy.xcodeproj \
            -scheme Civy -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/CivyBuild" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
      - name: Package unsigned Civy Beta IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/CivyBuild/Build/Products/Release-iphoneos/Civy.app"
          test -f "$APP/Civy"
          test ! -d "$APP/_CodeSignature"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/Civy.app
          cd dist
          zip -qry Civy-3.7-Beta-unsigned.ipa Payload
          unzip -t Civy-3.7-Beta-unsigned.ipa | tail -1
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Civy-3.7-Beta-unsigned-IPA
          path: dist/Civy-3.7-Beta-unsigned.ipa
          compression-level: 0
          if-no-files-found: error
