name: One-time reference Settings rework

on:
  push:
    branches: [main]
    paths:
      - ".github/reference-settings-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch reference Settings UI
        run: python .github/scripts/reference_settings_upgrade.py

      - name: Validate backend
        run: python -m py_compile backend/server.py backend/scraper.py backend/providers/*.py

      - name: Validate frontend production build
        run: |
          cd frontend
          yarn install --frozen-lockfile
          yarn build

      - name: Commit Settings rework
        run: |
          git config user.name "Synapse Bot"
          git config user.email "264532369+lauraevan@users.noreply.github.com"
          git add frontend/src/components/SynapsePlayer.jsx
          git commit -m "Match player settings to reference design"
          git push
