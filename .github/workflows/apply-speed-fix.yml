name: Apply Miami speed fix

on:
  push:
    paths:
      - '.github/workflows/apply-speed-fix.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply speed patch
        run: python .github/scripts/apply_speed_fix.py

      - name: Install backend dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Validate backend and benchmark Miami
        run: |
          python -m py_compile backend/server.py backend/scraper.py backend/providers/vidy.py
          python - <<'PY'
          import asyncio
          import json
          import sys
          import time

          sys.path.insert(0, 'backend')
          started = time.perf_counter()
          import scraper
          import_ms = (time.perf_counter() - started) * 1000
          print(f'SCRAPER_IMPORT_MS={import_ms:.1f}')
          assert 'providers.cinejoy' not in sys.modules, 'CineJoy/wasmtime must stay lazy on the Miami cold path'

          async def main():
              last = []
              for attempt in range(2):
                  t0 = time.perf_counter()
                  last = await scraper.scrape_streams('movie', '1083381', provider_id='vidy', mirror='miami')
                  elapsed = time.perf_counter() - t0
                  print(f'MIAMI_ATTEMPT_{attempt + 1}_SECONDS={elapsed:.3f} COUNT={len(last)}')
                  if last:
                      break
              assert last, 'Miami returned no playable source during validation'
              assert all(s.get('provider') == 'vidy' for s in last)
              assert any(str(s.get('name', '')).lower() == 'miami' for s in last)
              print('MIAMI_QUALITIES=' + json.dumps([s.get('quality') for s in last]))

          asyncio.run(main())

          import server
          assert '/api/caption' in server._caption_url('https://example.com/a.vtt', '', '')
          assert server._http_client is None, 'HTTP pool should stay lazy until the first outbound request'
          print('BACKEND_VALIDATION_OK')
          PY

      - name: Build optimized frontend
        run: |
          grep -q 'vidy,cinejoy' frontend/src/components/SynapsePlayer.jsx
          grep -q 'abrEwmaDefaultEstimate' frontend/src/components/SynapsePlayer.jsx
          grep -q 'exclude: options.exclude' frontend/src/lib/api.js
          yarn --cwd frontend install
          CI=false GENERATE_SOURCEMAP=false yarn --cwd frontend build
          rm -rf public
          cp -R frontend/build public
          # backend/public duplicated the entire React build into every Python function.
          # server.py never serves it, so leave the serverless bundle lean.
          rm -rf backend/public

      - name: Commit optimized runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A backend frontend/src public
          git commit -m "Make Miami playback and SynScraper load much faster"
          git push

