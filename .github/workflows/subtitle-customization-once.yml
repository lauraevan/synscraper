name: One-time subtitle customization

on:
  push:
    branches: [main]
    paths:
      - ".github/subtitle-customization-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upgrade subtitle renderer and controls
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("frontend/src/components/SynapsePlayer.jsx")
          t = p.read_text()

          def rep(old, new, label):
              global t
              if old not in t:
                  raise SystemExit(f"missing patch target: {label}")
              t = t.replace(old, new, 1)

