name: Apply player download settings

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'Run player download patch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch player
        run: python scripts/apply_player_download.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/SynapsePlayer.jsx frontend/src/pages/Watch.jsx
          git commit -m "Move downloads into player settings"
          git push origin HEAD:main
