name: Apply source badges and Miami fast path

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-source-badges-miami.py'
      - '.github/workflows/apply-source-badges-miami.yml'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply source badge and Miami optimization patch
        run: python .github/scripts/patch-source-badges-miami.py

      - name: Install backend dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Compile backend
        run: python -m py_compile backend/providers/vidy.py backend/scraper.py backend/server.py

      - name: Live test Miami fast path
        run: |
          PYTHONPATH=backend python - <<'PY'
          import json, time
          from providers.vidy import VidyResolver

          hint = {"title": "Backrooms", "year": 2026, "imdbId": ""}
          started = time.perf_counter()
          result = json.loads(VidyResolver(debug=True).resolve(
              "1083381", media_type="movie", provider="miami", metadata_hint=hint
          ))
          elapsed = time.perf_counter() - started
          streams = result.get("playable_urls") or []
          qualities = [str(item.get("quality") or "") for item in streams]
          print("MIAMI_STATUS=", result.get("status"))
          print("MIAMI_SECONDS=", round(elapsed, 3))
          print("MIAMI_STREAMS=", len(streams))
          print("MIAMI_QUALITIES=", qualities)
          if result.get("status") != "success" or not streams:
              raise SystemExit(result.get("message") or "Miami returned no streams")
          if not any("2160" in q or "4k" in q.lower() for q in qualities):
              raise SystemExit("Miami 4K missing")
          if not any("1080" in q for q in qualities):
              raise SystemExit("Miami 1080p missing")
          PY

      - name: Build frontend
        run: |
          yarn --cwd frontend install
          CI=false GENERATE_SOURCEMAP=false yarn --cwd frontend build
          rm -rf public
          cp -R frontend/build public
          if [ -d backend/public ]; then
            rm -rf backend/public
            cp -R frontend/build backend/public
          fi

      - name: Commit tested changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/providers/vidy.py backend/scraper.py backend/server.py frontend/src/components/SynapsePlayer.jsx frontend/src/lib/api.js public backend/public 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add source badges and accelerate Miami startup"
            git pull --rebase origin main
            git push origin main
          fi
