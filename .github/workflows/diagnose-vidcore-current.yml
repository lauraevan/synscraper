name: Diagnose current VidCore API

on:
  push:
    branches: [vidcore-integration]
    paths:
      - '.github/workflows/diagnose-vidcore-current.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install diagnostic dependency
        run: python -m pip install -q requests
      - name: Test current VidCore primary source API
        run: |
          python - <<'PY'
          import json, requests, urllib.parse

          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/137 Safari/537.36'
          s=requests.Session(); s.headers.update({'User-Agent':ua,'Accept':'application/json,text/plain,*/*','Referer':'https://vidcore.org/embed/movie/1083381','Origin':'https://vidcore.org'})
          url='https://vidrack.created.app/api/sources/cineplay?id=1083381&type=movie'
          r=s.get(url,timeout=12)
          print('PACIFIC_STATUS',r.status_code,'CT',r.headers.get('content-type'),'LEN',len(r.content))
          print('PACIFIC_CORS',r.headers.get('access-control-allow-origin'))
          r.raise_for_status()
          data=r.json()
          print('ROOT_KEYS',sorted(data.keys()) if isinstance(data,dict) else type(data).__name__)
          sources=data.get('sources') or [] if isinstance(data,dict) else []
          print('SOURCE_COUNT',len(sources))
          for idx,item in enumerate(sources[:12]):
              if not isinstance(item,dict): continue
              raw=str(item.get('url') or '')
              host=urllib.parse.urlparse(raw).hostname or ''
              print('SOURCE',idx,'quality=',item.get('quality'),'label=',item.get('label'),'type=',item.get('type'),'host=',host,'is_http=',raw.startswith('http'))
          if not sources:
              raise SystemExit('VidCore Pacific returned no sources')
          PY
