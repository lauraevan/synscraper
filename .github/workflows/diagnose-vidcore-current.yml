name: Diagnose current VidCore API

on:
  push:
    branches: [vidcore-integration]
    paths:
      - '.github/workflows/diagnose-vidcore-current.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install diagnostic dependency
        run: python -m pip install -q requests
      - name: Test VidCore relay path
        run: |
          python - <<'PY'
          import requests, urllib.parse

          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/137 Safari/537.36'
          referer='https://vidcore.org/embed/movie/1083381'
          s=requests.Session(); s.headers.update({'User-Agent':ua,'Accept':'application/json,text/plain,*/*','Referer':referer,'Origin':'https://vidcore.org'})
          api='https://vidrack.created.app/api/sources/cineplay?id=1083381&type=movie'
          r=s.get(api,timeout=12); r.raise_for_status()
          sources=(r.json() or {}).get('sources') or []
          best=next((x for x in sources if str(x.get('quality'))=='2160p'), sources[0] if sources else None)
          if not best: raise SystemExit('no VidCore source')
          raw=str(best.get('url') or '')
          relay='https://php-fredhorton613.wasmer.app/proxy1.php?play=' + urllib.parse.quote(raw,safe='')
          m=s.get(relay,headers={'User-Agent':ua,'Accept':'*/*','Referer':referer,'Origin':'https://vidcore.org'},timeout=15,allow_redirects=True)
          print('RELAY_STATUS',m.status_code,'CT',m.headers.get('content-type'),'LEN',len(m.content))
          print('RELAY_CORS',m.headers.get('access-control-allow-origin'))
          print('RELAY_HAS_EXTM3U','#EXTM3U' in m.text[:4096])
          print('RELAY_FIRST_LINES')
          for line in m.text.splitlines()[:12]:
              if line.startswith('http'):
                  p=urllib.parse.urlparse(line)
                  print('URL host=',p.hostname,'path_suffix=',p.path[-40:])
              else:
                  print(line[:240])
          m.raise_for_status()
          if '#EXTM3U' not in m.text[:4096]: raise SystemExit('relay is not HLS')
          PY
