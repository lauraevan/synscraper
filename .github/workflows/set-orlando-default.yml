name: Set Orlando default source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/set-orlando-default.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source priority
        run: python .github/scripts/set_orlando_default.py
      - name: Commit source priority change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/SynapsePlayer.jsx backend/scraper.py
          git commit -m "Make Orlando default with Miami fallback"
          git push origin HEAD:main
