name: Diagnose CineJoy live player

on:
  push:
    paths:
      - '.github/workflows/diagnose-cinejoy.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture CineJoy app chunks
        shell: bash
        run: |
          mkdir -p cinejoy-diagnostic
          python - <<'PY'
          import html, json, re, urllib.request
          from collections import deque
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          out = Path('cinejoy-diagnostic')
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36'
          headers = {'User-Agent': UA, 'Accept': '*/*', 'Accept-Language': 'en-US,en;q=0.9'}

          def get(url, referer=None):
              h = dict(headers)
              if referer: h['Referer'] = referer
              req = urllib.request.Request(url, headers=h)
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read()
                  return r.geturl(), r.status, dict(r.headers.items()), raw.decode('utf-8', 'ignore')

          summary = {'pages': [], 'captures': [], 'interesting': []}
          base = 'https://cinejoy.to/'
          final, status, hs, body = get(base)
          (out/'page.html').write_text(body, encoding='utf-8')
          summary['pages'].append({'url': final, 'status': status, 'content_type': hs.get('Content-Type',''), 'file': 'page.html', 'bytes': len(body)})

          seeds = []
          seeds += [urljoin(final, html.unescape(x)) for x in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', body, re.I)]
          seeds += [urljoin(final, html.unescape(x)) for x in re.findall(r'<link[^>]+rel=["\']modulepreload["\'][^>]+href=["\']([^"\']+)["\']', body, re.I)]
          seeds += [urljoin(final, '/service-worker.js'), urljoin(final, '/manifest.json')]

          queue = deque(seeds)
          seen = set()
          idx = 0
          while queue and len(seen) < 220:
              url = queue.popleft()
              if url in seen: continue
              if urlparse(url).hostname not in {'cinejoy.to', 'www.cinejoy.to'}: continue
              seen.add(url)
              try:
                  u, st, ch, text = get(url, final)
              except Exception as e:
                  summary['captures'].append({'url': url, 'error': repr(e)})
                  continue
              ext = '.json' if 'json' in ch.get('Content-Type','').lower() else '.js'
              name = f'asset-{idx:03d}{ext}'
              idx += 1
              (out/name).write_text(text, encoding='utf-8')
              summary['captures'].append({'url': u, 'status': st, 'content_type': ch.get('Content-Type',''), 'file': name, 'bytes': len(text)})

              if ext == '.js':
                  refs = set()
                  refs.update(re.findall(r'["\'](/_app/immutable/[^"\']+?\.js)["\']', text))
                  refs.update(re.findall(r'["\'](\.\.?/[^"\']+?\.js)["\']', text))
                  for ref in refs:
                      queue.append(urljoin(u, ref))

          needles = [
              'fetch(', 'axios', '/api/', 'api.', 'tmdb', 'imdb', 'movie', 'tv', 'season', 'episode',
              'source', 'stream', 'server', 'provider', 'embed', 'iframe', 'm3u8', 'mpd', 'token', 'decrypt',
              'crypto', 'atob', 'base64', 'manifest', 'playlist', 'vidsrc', 'vidlink', 'vidnest', 'vidrock',
              'rabbit', 'megacloud', 'upcloud', 'filemoon', 'streamtape'
          ]
          for item in summary['captures']:
              name = item.get('file')
              if not name or not name.endswith('.js'): continue
              text = (out/name).read_text(encoding='utf-8', errors='ignore')
              low = text.lower()
              for needle in needles:
                  start = 0; count = 0
                  while count < 24:
                      pos = low.find(needle.lower(), start)
                      if pos < 0: break
                      summary['interesting'].append({'file': name, 'url': item.get('url'), 'needle': needle, 'position': pos, 'snippet': text[max(0,pos-1100):min(len(text),pos+3500)]})
                      start = pos + len(needle); count += 1

          (out/'summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          PY
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: cinejoy-diagnostic
          path: cinejoy-diagnostic/
          retention-days: 1
