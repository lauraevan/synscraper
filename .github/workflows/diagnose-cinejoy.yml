name: Diagnose CineJoy live player

on:
  push:
    paths:
      - '.github/workflows/diagnose-cinejoy.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture CineJoy response shapes
        shell: bash
        run: |
          mkdir -p cinejoy-diagnostic
          cat > cinejoy-diagnostic/probe.mjs <<'JS'
          import { writeFile } from 'node:fs/promises';
          import { webcrypto } from 'node:crypto';
          if (!globalThis.crypto) globalThis.crypto = webcrypto;
          const API='https://api.shegu.st', enc=new TextEncoder(), dec=new TextDecoder();
          const ab=u=>u.buffer.slice(u.byteOffset,u.byteOffset+u.byteLength);
          let w;
          async function wasm(){if(w)return w;const r=await fetch(API+'/crush.wasm');const b=new Uint8Array(await r.arrayBuffer());await writeFile('cinejoy-diagnostic/crush.wasm',b);w=(await WebAssembly.instantiate(b,{})).instance.exports;return w}
          async function seal(path,payload){const x=await wasm(),req=enc.encode(JSON.stringify({path,payload:payload??null})),rnd=new Uint8Array(44);crypto.getRandomValues(rnd);const cap=req.length+512,a=x.alloc(req.length),b=x.alloc(rnd.length),c=x.alloc(cap);try{let m=new Uint8Array(x.memory.buffer);m.set(req,a);m.set(rnd,b);const n=x.seal_request(a,req.length,b,rnd.length,c,cap);m=new Uint8Array(x.memory.buffer);const o=m.slice(c,c+n);return{key:o.slice(0,32),kid:o[32],pub:o.slice(33,98),body:o.slice(98)}}finally{x.dealloc(a,req.length);x.dealloc(b,rnd.length);x.dealloc(c,cap)}}
          function aad(k,p){const n=enc.encode('lumen-gate-v2'),o=new Uint8Array(n.length+3+p.length);o.set(n);o.set([0,2,k],n.length);o.set(p,n.length+3);return o}
          async function call(path,params){const s=await seal(path,Object.fromEntries(params.entries())),r=await fetch(API+'/g',{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:ab(s.body)}),bytes=new Uint8Array(await r.arrayBuffer()),key=await crypto.subtle.importKey('raw',ab(s.key),'AES-GCM',false,['decrypt']),clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:ab(bytes.subarray(0,12)),additionalData:ab(aad(s.kid,s.pub)),tagLength:128},key,ab(bytes.subarray(12)));return JSON.parse(dec.decode(clear))}
          const sj=await (await fetch(API+'/servers')).json(), servers=sj.servers||[], out={servers, movie:{}, tv:{}};
          for(const s of servers.filter(x=>x.status==='ok')){const id=s.id??s.server??s.name;try{out.movie[id]=await call('/'+id+'/movie',new URLSearchParams({tmdb:'550'}))}catch(e){out.movie[id]={error:String(e?.message||e)}}}
          for(const s of servers.filter(x=>x.status==='ok').slice(0,4)){const id=s.id??s.server??s.name;try{out.tv[id]=await call('/'+id+'/series',new URLSearchParams({tmdb:'1399',season:'1',episode:'1'}))}catch(e){out.tv[id]={error:String(e?.message||e)}}}
          await writeFile('cinejoy-diagnostic/responses.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify({providers:servers.map(x=>x.id??x.server??x.name),movie_ok:Object.entries(out.movie).filter(([,v])=>v?.status===200).map(([k])=>k),tv_ok:Object.entries(out.tv).filter(([,v])=>v?.status===200).map(([k])=>k)},null,2));
          JS
          node cinejoy-diagnostic/probe.mjs
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: cinejoy-diagnostic
          path: cinejoy-diagnostic/
          retention-days: 1
