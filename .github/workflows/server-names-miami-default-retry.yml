name: Retry clean server names and Miami default

on:
  push:
    paths:
      - '.github/workflows/server-names-miami-default-retry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('backend/scraper.py')
          t = p.read_text()
          old = '''            if subserver:\n                if pid == "vidzee":\n                    pretty = {\n                        "dcloud": "DCloud",\n                        "tik": "Tik",\n                        "ipcloud": "IPCloud",\n                        "v6:hindi": "V6 Hindi",\n                    }.get(subserver.lower(), subserver)\n                    display_name = f"{name} · {pretty}"\n                elif subserver.lower().startswith(name.lower()):\n                    display_name = subserver\n                else:\n                    display_name = f"{name} · {subserver}"\n            else:\n                display_name = name if idx == 0 else f"{name} {idx + 1}"\n'''
          new = '''            if subserver:\n                if pid == "vidzee":\n                    display_name = {\n                        "dcloud": "DCloud",\n                        "tik": "Tik",\n                        "ipcloud": "IPCloud",\n                        "v6:hindi": "V6 Hindi",\n                    }.get(subserver.lower(), subserver)\n                else:\n                    display_name = subserver\n                    if display_name.lower().startswith(name.lower()):\n                        display_name = display_name[len(name):].lstrip(" ·:-")\n                    display_name = display_name or name\n            else:\n                display_name = name if idx == 0 else f"{name} {idx + 1}"\n'''
          assert old in t
          t = t.replace(old, new, 1)
          old = '''    # rank: primary first, then hls before mp4\n    servers.sort(key=lambda s: (0 if s["primary"] else 1, 0 if s["type"] == "hls" else 1))\n'''
          new = '''    # Miami is the default playback source. Start at 1080p for faster loading.\n    def _server_rank(server):\n        if server.get("provider") == "vidy" and str(server.get("name") or "").lower() == "miami":\n            quality = str(server.get("quality") or "").lower()\n            qrank = 0 if "1080" in quality else 1 if "720" in quality else 2 if "480" in quality else 3 if ("2160" in quality or "4k" in quality) else 4\n            return (0, qrank, 0 if server.get("type") == "hls" else 1)\n        return (1 if server.get("primary") else 2, 0, 0 if server.get("type") == "hls" else 1)\n\n    servers.sort(key=_server_rank)\n'''
          assert old in t
          p.write_text(t.replace(old, new, 1))

          p = Path('backend/server.py')
          t = p.read_text().replace('FastAPI(title="Synapse Player API")', 'FastAPI(title="SynScraper API")')
          t = t.replace('logging.getLogger("synapse-player")', 'logging.getLogger("synscraper")')
          t = t.replace('"message": "Synapse Player API"', '"message": "SynScraper API"')
          p.write_text(t)

          p = Path('frontend/src/components/SynapsePlayer.jsx')
          t = p.read_text()
          old = '''const SOURCE_CATALOG = [\n    { provider: "castle", name: "Orbit" },\n    { provider: "vidlink", name: "Nova" },\n    { provider: "vidnest", name: "Nest" },\n    { provider: "vidzee", name: "Zen" },\n    { provider: "vidrock", name: "Rock" },\n    { provider: "vidy", name: "Vidy" },\n    { provider: "cinejoy", name: "CineJoy" },\n    { provider: "vixsrc", name: "Vix" },\n];'''
          new = '''const SOURCE_CATALOG = [\n    { provider: "vidy", name: "Miami" },\n    { provider: "castle", name: "Orbit" },\n    { provider: "vidlink", name: "Nova" },\n    { provider: "vidnest", name: "Nest" },\n    { provider: "vidzee", name: "Zen" },\n    { provider: "vidrock", name: "Rock" },\n    { provider: "cinejoy", name: "Lisbon" },\n    { provider: "vixsrc", name: "Vix" },\n];'''
          assert old in t
          t = t.replace(old, new, 1)
          old = '''                if (list.length) {\n                    setServerId(list[0].id);\n                    setMode("ready");\n'''
          new = '''                if (list.length) {\n                    const preferred = list.find((s) => s.provider === "vidy" && /miami/i.test(String(s.name || "")) && qualityHeight(s.quality) === 1080)\n                        || list.find((s) => s.provider === "vidy" && /miami/i.test(String(s.name || "")))\n                        || list[0];\n                    setServerId(preferred.id);\n                    setMode("ready");\n'''
          assert old in t
          t = t.replace(old, new, 1)
          old = '''        if (!matches.length) {\n            return [{ id: `unavailable-${source.provider}`, provider: source.provider, name: source.name, displayName: source.name, available: false }];\n        }'''
          new = '''        if (!matches.length) {\n            if (source.provider === "vidy" || source.provider === "cinejoy") return [];\n            return [{ id: `unavailable-${source.provider}`, provider: source.provider, name: source.name, displayName: source.name, available: false }];\n        }'''
          assert old in t
          t = t.replace(old, new, 1)
          t = t.replace('    const [brandExpanded, setBrandExpanded] = useState(false);\n', '')
          t = t.replace('                        <p className="text-[11px] font-medium uppercase tracking-[0.24em] text-white/35">Synapse Player</p>\n', '')
          t = t.replace('This source exposes no caption track. Pick another source above; Synapse keeps your movie position while it switches.', 'This source exposes no caption track. Pick another source above; your movie position is kept while it switches.')
          t = t.replace('                                                    <span>{s.name}</span><span className="text-[10px] opacity-45">{s.provider}</span>\n', '                                                    <span>{s.name}</span>\n')
          start_mark = '                        <button\n                            data-testid="synplayer-brand-pill"'
          start = t.index(start_mark)
          end_mark = '                        </button>\n                    </div>'
          end = t.index(end_mark, start)
          t = t[:start] + '                    </div>' + t[end + len(end_mark):]
          assert 'Synapse Player' not in t
          assert 'synplayer-brand-pill' not in t
          assert 'brandExpanded' not in t
          p.write_text(t)
          PY
      - name: Validate
        run: |
          python -m py_compile backend/scraper.py backend/server.py
          grep -q 'name: "Miami"' frontend/src/components/SynapsePlayer.jsx
          ! grep -q 'Synapse Player' frontend/src/components/SynapsePlayer.jsx
          ! grep -q 'synplayer-brand-pill' frontend/src/components/SynapsePlayer.jsx
      - name: Build frontend
        run: |
          yarn --cwd frontend install
          CI=false GENERATE_SOURCEMAP=false yarn --cwd frontend build
          rm -rf public backend/public
          cp -R frontend/build public
          cp -R frontend/build backend/public
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/scraper.py backend/server.py frontend/src/components/SynapsePlayer.jsx public backend/public
          git commit -m "Use clean server names and make Miami default"
          git push
