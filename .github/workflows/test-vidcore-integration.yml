name: Test VidCore integration

on:
  push:
    branches: [vidcore-integration]
    paths:
      - 'backend/providers/vidcore.py'
      - '.github/scripts/integrate_vidcore.py'
      - '.github/workflows/test-vidcore-integration.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vidcore-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply integration
        run: python .github/scripts/integrate_vidcore.py

      - name: Install backend dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Compile backend
        run: python -m py_compile backend/providers/vidcore.py backend/scraper.py backend/server.py

      - name: Live-test VidCore with licensed Backrooms demo
        run: |
          PYTHONPATH=backend python - <<'PY'
          import json, time, requests
          from providers.vidcore import VidCoreResolver

          started = time.perf_counter()
          result = json.loads(VidCoreResolver(debug=True).resolve('1083381', media_type='movie'))
          elapsed = time.perf_counter() - started
          streams = result.get('playable_urls') or []
          qualities = [s.get('quality') for s in streams]
          print('VIDCORE_STATUS=', result.get('status'))
          print('VIDCORE_SECONDS=', round(elapsed, 3))
          print('VIDCORE_SERVER_COUNT=', len(streams))
          print('VIDCORE_QUALITIES=', qualities)
          if result.get('status') != 'success' or not streams:
              raise SystemExit(result.get('message') or 'VidCore returned no playable streams')
          if not all(str(s.get('url') or '').startswith('http') for s in streams):
              raise SystemExit('VidCore returned an invalid stream URL')
          if not {'2160p','1080p','720p'}.issubset(set(qualities)):
              raise SystemExit(f'Expected VidCore 4K/1080p/720p, got {qualities!r}')

          # Verify the best returned HLS is a real, readable playlist with the same
          # headers SynScraper will forward through /api/hls.
          best = next((s for s in streams if s.get('quality') == '2160p'), streams[0])
          manifest = requests.get(
              best['url'],
              headers=best.get('headers') or {},
              timeout=12,
              allow_redirects=True,
          )
          print('VIDCORE_MANIFEST_STATUS=', manifest.status_code)
          print('VIDCORE_MANIFEST_CT=', manifest.headers.get('content-type'))
          print('VIDCORE_MANIFEST_BYTES=', len(manifest.content))
          manifest.raise_for_status()
          if '#EXTM3U' not in manifest.text[:4096]:
              raise SystemExit('VidCore source did not return an HLS manifest')
          print('VIDCORE_MANIFEST_OK=1')
          PY

      - name: Build frontend
        run: |
          yarn --cwd frontend install
          CI=false GENERATE_SOURCEMAP=false yarn --cwd frontend build
          rm -rf public
          cp -R frontend/build public

      - name: Commit tested integration to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/scraper.py frontend/src/components/SynapsePlayer.jsx public
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Integrate VidCore source"
            git pull --rebase origin vidcore-integration
            git push origin vidcore-integration
          fi
