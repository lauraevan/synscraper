name: One-time Zen Rock resolver diagnostic

on:
  push:
    paths:
      - '.github/zen-rock-diagnostic-trigger'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m py_compile backend/server.py backend/scraper.py backend/providers/*.py
      - name: Live resolver smoke test
        run: |
          cd backend
          python - <<'PY'
          import json
          import urllib.request
          from providers.vidzee import VidzeeResolver
          from providers.vidrock import VidrockResolver

          def smoke(label, resolver):
              data = json.loads(resolver.resolve('550', media_type='movie'))
              print(f'{label}_STATUS={data.get("status")}')
              print(f'{label}_COUNT={len(data.get("playable_urls") or [])}')
              if data.get('status') != 'success' or not data.get('playable_urls'):
                  raise SystemExit(f'{label} failed: {data.get("message")}')
              stream = data['playable_urls'][0]
              headers = dict(stream.get('headers') or {})
              headers.setdefault('User-Agent', 'Mozilla/5.0')
              headers.setdefault('Accept', '*/*')
              req = urllib.request.Request(stream['url'], headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  prefix = response.read(256)
                  print(f'{label}_PLAYBACK_HTTP={getattr(response, "status", 200)}')
                  print(f'{label}_PLAYBACK_CT={response.headers.get("Content-Type", "")}')
                  if not prefix:
                      raise SystemExit(f'{label} playback body was empty')

          smoke('ZEN', VidzeeResolver(debug=True))
          smoke('ROCK', VidrockResolver(debug=True))
          PY
