[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synscraper-resolvers"
version = "1.0.0"
description = "Standalone, reusable movie/TV provider resolvers from Synscraper"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31,<3",
  "pycryptodome>=3.20,<4",
  "wasmtime>=20,<50"
]

[project.optional-dependencies]
browser = ["curl_cffi>=0.11,<1", "playwright>=1.45,<2"]

[project.scripts]
synscraper-providers = "synscraper_cli:main"

[tool.setuptools]
package-dir = {"" = "backend"}
py-modules = ["scraper", "provider_api", "synscraper_cli"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["providers", "providers.*"]
